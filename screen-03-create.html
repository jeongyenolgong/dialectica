<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store">
<title>디알렉티카 — 스크린 · 문장 창작</title>
<link rel="stylesheet" href="font.css?b=261007-1">
<link rel="stylesheet" href="screen.css?b=261007-1">
<script src="bus.js?b=261007-1"></script>
<script src="data.js?b=261012-1"></script>
<script src="screen.js?b=261007-1"></script>
</head>
<body>
<!-- ─────────────────────────────────────────────────────────────────────
     스크린 9.3 창작 (2026.10.07)
     단어 순위(문장에 가장 많이 쓰인 단어) · 개인 순위(만든 문장 수) · 방 평균 네 막대(세 캐릭터 + OU)
     ⭐ OU 막대는 이 단계에서 처음 나타납니다. 끝에 네 막대가 모두 차면 진행자가 넘깁니다.
     ⛔ 팀 순위는 없앴습니다 — 2026.10.07 팀전 폐지.
     ───────────────────────────────────────────────────────────────────── -->
<header><span class="ko">디알렉티카</span><span class="la">DIALECTICA</span></header>
<h1 class="stage"><span class="ko">문장 창작</span><span class="la">SENTENCE CREATION</span></h1>

<main class="three">
  <section><h2>단어 순위</h2><ol id="w"></ol></section>
  <section><h2>개인 순위</h2><ol id="p"></ol></section>
  <section><h2>방 평균</h2><div class="bars" id="bars"></div></section>
</main>
<p id="gauge"></p>

<script>
SC.sizes();
const WORD_W = Math.max(...DLK.WORDS.map(x => [...x.w].length));
const setW = SC.top3(document.getElementById("w"), WORD_W, false);
const setP = SC.top3(document.getElementById("p"), 6, true);
const setBars = SC.bars(document.getElementById("bars"), [...DLK.CHARS, DLK.OU]);
let book = Bus.state(), settle = null, prevKey = null;

function rank(force){
  const W = Object.entries(book.sents || {}).filter(([,v]) => v.n > 0)
    .sort((a,b) => b[1].n - a[1].n || a[1].at - b[1].at).slice(0,3).map(([k]) => k);
  const P = (book.players || []).filter(p => p.name && (p.sent||0) > 0)
    .sort((a,b) => (b.sent||0) - (a.sent||0) || (a.at||0) - (b.at||0)).slice(0,3).map(p => p.name);
  const key = W.join("|") + "#" + P.join("|");
  if(force || key !== prevKey){ prevKey = key; setW(W, true); setP(P, true); }
  const a = SC.roomAvg(book);
  setBars(a ? [...a.g, a.ou] : null);
}
Bus.onState(b => { book = b; clearTimeout(settle); settle = setTimeout(() => rank(false), 700); });
addEventListener("resize", () => { SC.sizes(); rank(true); });
rank(true);
</script>
</body>
</html>
