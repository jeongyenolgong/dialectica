<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store">
<title>디알렉티카 — 스크린 · 단어 수집</title>
<link rel="stylesheet" href="font.css?b=261007-1">
<link rel="stylesheet" href="screen.css?b=261007-1">
<style>
  /* ── 모두의 답 — 사람들이 쓴 Opposite이 무작위로 돌아갑니다(조건은 2026.10.07 오후 하나로 통일) ── */
  .answers{flex:0 0 auto; border-top:1px solid var(--line); padding:2.4vh 0 1vh}
  .answers h2{padding-bottom:2vh}
  .ans{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:2vw}
  .a{display:flex; flex-direction:column; align-items:center; gap:1.2vh; text-align:center;
     min-height:calc(var(--rank) * 3.6); transition:opacity .3s steps(3)}
  .a.out{opacity:0}
  .a .w{font-size:var(--rank); background:var(--name); color:var(--bg); padding:.15em .4em}
  .a .k{font-size:calc(var(--rank) * .6); color:var(--line); letter-spacing:.1em}
  .a .t{font-size:var(--rank); line-height:1.3; word-break:keep-all}
</style>
<script src="bus.js?b=261014-9"></script>
<script src="settings.js?b=261014-7"></script>
<script src="data.js?b=261014-7"></script>
<script src="screen.js?b=261014-7"></script>
</head>
<body>
<!-- ─────────────────────────────────────────────────────────────────────
     스크린 수집 (2026.10.07)
     세 덩어리 — 단어 순위(가장 많이 모인 단어) · 개인 순위(모은 단어 수) · 방 평균(세 캐릭터)
     ⭐ 숫자를 감추고 자리만 보입니다 — 순위 두 덩어리에는 개수가 없습니다.
        방 평균에는 숫자를 붙입니다(사용자 "세가지 값의 평균도").
     ⭐ 아래 띠 — 단어마다 사람들이 입력한 답을 무작위로 돌려 보여 줍니다
        (2026.10.07 사용자 "각 단어별로 사람들이 입력한 … 램덤하게").
        누가 썼는지는 붙이지 않습니다.
     ───────────────────────────────────────────────────────────────────── -->
<header><span class="ko">디알렉티카</span><span class="la">DIALECTICA</span></header>
<h1 class="stage"><span class="ko" data-t="s.collect.title"></span><span class="la" data-t="s.collect.title_en"></span></h1>

<main class="three">
  <section><h2 data-t="s.collect.word_rank"></h2><ol id="w"></ol></section>
  <section><h2 data-t="s.collect.person_rank"></h2><ol id="p"></ol></section>
  <section><h2 data-t="s.collect.room_avg"></h2><div class="bars" id="bars"></div></section>
</main>

<section class="answers">
  <h2 data-t="s.collect.all_answers"></h2>
  <div class="ans" id="ans"><div class="a"></div><div class="a"></div><div class="a"></div></div>
</section>
<p id="gauge"></p>

<script>
SC.sizes();
const WORD_W = Math.max(...DLK.WORDS.map(x => [...x.w].length));
const setW = SC.top3(document.getElementById("w"), WORD_W, false);
const setP = SC.top3(document.getElementById("p"), 6, true);
const setBars = SC.bars(document.getElementById("bars"), DLK.CHARS);
let book = Bus.state(), settle = null, prevKey = null;

function rank(force){
  const W = Object.entries(book.words || {}).filter(([,v]) => v.n > 0)
    .sort((a,b) => b[1].n - a[1].n || a[1].at - b[1].at).slice(0,3).map(([k]) => k);
  const P = (book.players || []).filter(p => p.name && (p.cnt||0) > 0)
    .sort((a,b) => (b.cnt||0) - (a.cnt||0) || (a.at||0) - (b.at||0)).slice(0,3).map(p => p.name);
  /* 어느 하나가 바뀌면 두 목록 전부가 한 번 좌르륵 */
  const key = W.join("|") + "#" + P.join("|");
  if(force || key !== prevKey){ prevKey = key; setW(W, true); setP(P, true); }
  const a = SC.roomAvg(book);
  setBars(a ? a.g : null);
}

/* ── 모두의 답 — 4초마다 세 칸을 무작위로 갈아 끼웁니다 ── */
function pool(){
  const out = [];
  (book.players || []).forEach(p => (p.got || []).forEach(x => out.push(x)));
  return out;
}
let shownKeys = [];
function rotate(){
  const all = pool();
  const boxes = [...document.querySelectorAll(".a")];
  if(!all.length){ boxes.forEach(b => b.innerHTML = ""); return; }
  /* 방금 보인 것은 피하고, 같은 단어가 두 칸에 겹치지 않게 */
  const fresh = all.filter(x => !shownKeys.includes(x.w + "|" + x.a));
  const src = (fresh.length >= 3 ? fresh : all).slice().sort(() => Math.random() - .5);
  const picked = [], ws = new Set();
  for(const x of src){ if(picked.length >= 3) break; if(ws.has(x.w)) continue; ws.add(x.w); picked.push(x); }
  shownKeys = picked.map(x => x.w + "|" + x.a);
  boxes.forEach((b, i) => {
    b.classList.add("out");
    setTimeout(() => {
      const x = picked[i];
      const info = x ? DLK.WORDS.find(o => o.w === x.w) : null;
      b.innerHTML = x ? `<span class="w">${DLK.esc(x.w)}</span><span class="k">${info ? info.c : ""}</span>`
                      + `<span class="t">${DLK.esc(x.a)}</span>` : "";
      b.classList.remove("out");
    }, 300 + i*120);
  });
}
setInterval(rotate, 4000);

Bus.onState(b => {
  book = b;
  clearTimeout(settle);
  /* 몰려 들어와도 판이 안 엉키게 모아서 한 번에 */
  settle = setTimeout(() => { rank(false); if(!document.querySelector(".a").innerHTML) rotate(); }, 700);
});
addEventListener("resize", () => { SC.sizes(); rank(true); });
rank(true);
</script>
</body>
</html>
