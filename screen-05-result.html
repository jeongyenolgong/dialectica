<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store">
<title>디알렉티카 — 스크린 · 결과</title>
<link rel="stylesheet" href="font.css?b=261007-1">
<link rel="stylesheet" href="screen.css?b=261007-1">
<style>
  main{flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:1vh 0; min-height:0; overflow:hidden}
  /* ── 처음 / 현재 — 캐릭터마다 막대 두 줄 (2026.10.14 사용자 "처음 이 방의 평균은 이랬는데 현재는 이렇게 바뀌었다") ── */
  .cmp{display:flex; flex-direction:column; gap:3.6vh; width:min(78vw, 1500px)}
  .c{display:flex; flex-direction:column; gap:1.4vh}
  .c .nm{font-size:var(--title); letter-spacing:.06em; color:var(--gc); line-height:1.2}
  .row{display:grid; grid-template-columns:3.6em 1fr 3em; gap:1.4vw; align-items:center}
  .row .lb{font-size:var(--rank); color:var(--line); letter-spacing:.08em; white-space:nowrap}
  .row .cells{display:grid; grid-template-columns:repeat(20,1fr); gap:.3vw; height:3vh}
  .row .cells i{display:block; background:var(--dim)}
  .row.was .cells i.on{background:var(--line)}
  .row.now .cells i.on{background:var(--gc)}
  .row .v{font-size:var(--rank); text-align:right; font-variant-numeric:tabular-nums; color:var(--line)}
  .row.now .v{color:var(--gc)}
  .row .v::after{content:"%"}
  .row .v:empty::after{content:""}
  #idle{flex:1 1 auto; display:flex; align-items:center; justify-content:center; font-size:var(--title); color:var(--line); letter-spacing:.2em}
</style>
<script src="bus.js?b=261014-10"></script>
<script src="settings.js?b=261014-7"></script>
<script src="data.js?b=261014-10"></script>
<script src="screen.js?b=261014-7"></script>
</head>
<body>
<!-- ─────────────────────────────────────────────────────────────────────
     스크린 결과 (2026.10.14 시작/현재)
     사용자(2026.10.14) "처음 이 방의 평균은 이랬는데 현재는 이렇게 바뀌었다 이런 구조가 되면 좋겠어."
     ⭐ 셈 (2026.10.14 사용자 「권고대로 할게」 — 막대도 숫자도 비율. HANDOFF.md 4장)
     · 시작 개수 = 전원이 입장 때 고른 단어(사람마다 5개)를 캐릭터별로 센 것
     · 현재 개수 = 시작 개수 + 전원이 수집한 단어를 캐릭터별로 센 것. 100에서 멈추지 않습니다
     · 막대와 숫자 = 그 개수의 비율(세 캐릭터 합 100%). 방 전체 단어 수 한 줄은 두지 않습니다(사용자 "그 말은 필요 없어")
     · 이름을 내고 다섯을 다 고른 사람만 셉니다. 차이 줄(+ / −)은 없습니다
     · 폰 게이지·수집 스크린 방 평균과 같은 셈입니다(DLK.pct)
     · 「처음 이 방은 · N명」「지금 이 방은」 문구는 뺐고 가운데를 크게(2026.10.14 사용자 "이런 코멘트 필요 없어 중앙에 오는 내용을 더 크게", "시작과 현재로")
     · 연출: 시작 막대가 먼저 서고 한 박자 뒤 현재 막대가 자랍니다(2026.10.14 확정)
     ───────────────────────────────────────────────────────────────────── -->
<header><span class="ko">디알렉티카</span><span class="la">DIALECTICA</span></header>
<h1 class="stage"><span class="ko" data-t="s.result.title"></span><span class="la" data-t="s.result.title_en"></span></h1>
<main id="main" hidden>
  <div class="cmp" id="cmp"></div>
</main>
<div id="idle" data-t="s.result.idle"></div>
<script>
const $ = s => document.querySelector(s);
SC.sizes();
const C = DLK.CHARS;
$("#cmp").innerHTML = C.map(c => `<div class="c" style="--gc:${c.color}"><div class="nm">${c.ko}</div>
  <div class="row was"><span class="lb">${DLK.T("s.result.was")}</span><div class="cells">${"<i></i>".repeat(20)}</div><span class="v"></span></div>
  <div class="row now"><span class="lb">${DLK.T("s.result.now")}</span><div class="cells">${"<i></i>".repeat(20)}</div><span class="v"></span></div>
  </div>`).join("");

/* 캐릭터별 개수 — 시작(고른 다섯) · 현재(시작 + 수집). 100에서 멈추지 않습니다 */
function counts(b){
  const P = (b.players || []).filter(p => p.name && p.start && p.picks);
  if(!P.length) return null;
  const chOf = w => { const x = DLK.WORDS.find(o => o.w === w); return x ? x.ch : -1; };
  const was = C.map(() => 0), now = C.map(() => 0);
  P.forEach(p => {
    p.picks.forEach(w => { const c = chOf(w); if(c >= 0){ was[c]++; now[c]++; } });
    (p.got || []).forEach(x => { const c = chOf(x.w); if(c >= 0) now[c]++; });
  });
  return { was, now };
}
/* 비율 — DLK.pct (폰 게이지와 같은 셈) */
const pct = DLK.pct;
let key = null, timers = [];
/* 막대 — 여섯 줄 가운데 가장 큰 비율(top)이 20칸을 꽉 채우고, 나머지는 그에 비례합니다(2026.10.14 사용자 "꽉 채운 길이로 맞춰").
   숫자는 비율 그대로입니다 */
function fill(row, v, delay, top){
  const cells = [...row.querySelectorAll(".cells i")];
  cells.forEach(c => c.classList.remove("on"));
  row.querySelector(".v").textContent = "";
  if(v == null) return;
  const on = top > 0 ? Math.round(v / top * cells.length) : 0;
  cells.forEach((c, k) => { if(k < on) timers.push(setTimeout(() => c.classList.add("on"), delay + k*45)); });
  timers.push(setTimeout(() => { row.querySelector(".v").textContent = v; }, delay + on*45));
}
function render(b){
  const n = counts(b);
  $("#idle").style.display = n ? "none" : "flex";
  $("#main").hidden = !n;
  if(!n) return;
  const was = pct(n.was), now = pct(n.now), top = Math.max(...was, ...now);
  const k = n.was.join(",") + "|" + n.now.join(",");
  if(k === key) return; key = k;
  timers.forEach(clearTimeout); timers = [];
  [...$("#cmp").children].forEach((el, i) => {
    fill(el.querySelector(".row.was"), was[i], 200, top);
    fill(el.querySelector(".row.now"), now[i], 1600, top);
  });
}
Bus.onState(render);
addEventListener("resize", () => { SC.sizes(); key = null; render(Bus.state()); });
render(Bus.state());
</script>
</body>
</html>
