<!-- ─────────────────────────────────────────────────────────────────────
     스크린 9.5 결과 (2026.10.07 · 2026.10.13 창작·투표 삭제)
     방 평균 세 막대 — 「모두가 100이 된 상태를 확인하며 끝나는」 장면
     ⛔ 득표 문장 다섯 · OU 막대는 투표·창작과 함께 없앴습니다(2026.10.13 사용자 "창작과 투표 단계 삭제").
     ⛔ 우승 팀 · 최다 득표 개인 · 최종 누적 순위는 없앴습니다(2026.10.07).
     ⭐ 등장 연출은 없습니다 — 리뷰가 끝나면 즉시 결과판.
     🔴 결과 화면에 무엇을 더 보일지는 미정 — 사용자가 리뷰 내용을 세밀하게 정한 뒤 따라갑니다.
     ───────────────────────────────────────────────────────────────────── -->
<header><span class="ko">디알렉티카</span><span class="la">DIALECTICA</span></header>
<h1 class="stage"><span class="ko">결과 발표</span><span class="la">FINAL RESULT</span></h1>

<main>
  <section class="right"><h2>방 평균</h2><div class="bars" id="bars"></div></section>
</main>

<script>
SC.sizes();
const setBars = SC.bars(document.getElementById("bars"), DLK.CHARS);
let book = Bus.state();
function render(){
  const a = SC.roomAvg(book);
  setBars(a ? a.g : null);
}
Bus.onState(b => { book = b; render(); });
addEventListener("resize", () => { SC.sizes(); render(); });
render();
</script>
</body>
