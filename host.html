<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store">
<title>디알렉티카 — 진행자 화면</title>
<link rel="stylesheet" href="font.css?b=261007-1">
<style>
  :root{
    --bg:#101C8C; --line:#4E60D8; --fg:#FFFFFF; --dim:#8FA0E8;
    --body:16px; --hero:56px;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--fg);
    /* 8.1 — 본문은 일반 고딕. 이름 30개와 숫자를 하루 종일 봅니다 */
    font-family:"Apple SD Gothic Neo","Pretendard",-apple-system,sans-serif;
    font-size:var(--body); line-height:1.5;
    display:flex; flex-direction:column; overflow:hidden;
  }
  button{font-family:inherit; font-size:var(--body); cursor:pointer}

  header{flex:0 0 auto; display:grid; grid-template-columns:1fr auto 1fr;
         align-items:center; padding:14px 28px; border-bottom:1px solid var(--line)}
  .logo{font-family:"Galmuri11",monospace; font-size:22px; letter-spacing:.18em}
  .title{color:var(--dim); letter-spacing:.06em}
  .right{text-align:right}
  .ghost{background:transparent; color:var(--dim); border:1px solid var(--line);
         padding:5px 14px; letter-spacing:.04em; margin-left:6px}
  .ghost:hover{color:var(--fg); border-color:var(--fg)}

  .crumb{flex:0 0 auto; display:flex; gap:10px; padding:12px 28px; color:var(--dim); letter-spacing:.06em}
  .crumb b{font-weight:400}
  .crumb .on{color:var(--fg); text-decoration:underline; text-underline-offset:5px}

  main{flex:1 1 auto; display:flex; flex-direction:column; min-height:0; padding:0 28px 8px}
  .topline{flex:0 0 auto; display:grid; grid-template-columns:1fr auto 1fr;
           align-items:end; padding:6px 0 16px; min-height:80px}
  .hero{grid-column:2; text-align:center; letter-spacing:.04em; white-space:nowrap;
        display:flex; gap:28px; align-items:baseline; justify-content:center}
  .hero .n{font-size:var(--hero); line-height:1; margin:0 6px; font-variant-numeric:tabular-nums}
  .hero .k{color:var(--dim)}
  .topline .right{grid-column:3}
  #searchBox{background:transparent; color:var(--fg); border:1px solid var(--fg);
             padding:5px 12px; width:170px; letter-spacing:.04em; outline:none}
  #searchBox::placeholder{color:var(--dim)}

  /* ── 참가자 판 — 팀 열이 없어졌습니다. 한 판에 이름이 들어온 순서대로 ── */
  .board{flex:1 1 auto; min-height:0; border:1px solid var(--line); overflow-y:auto; padding:10px 0}
  .board ul{list-style:none; display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
            column-gap:10px}
  .board li{display:flex; align-items:baseline; gap:12px; padding:4px 16px; cursor:pointer}
  .board li:hover{background:rgba(255,255,255,.07)}
  .board li .code{color:var(--dim); font-variant-numeric:tabular-nums; letter-spacing:.14em; visibility:hidden}
  .board li.open .code{visibility:visible}
  .board li .num{margin-left:auto; font-variant-numeric:tabular-nums; letter-spacing:.02em; color:var(--dim)}
  .board li .num b{color:var(--fg); font-weight:400}
  .board li.miss{opacity:.16}
  .board li.done .num b{text-decoration:underline; text-underline-offset:4px}

  /* ── 리뷰 타임 — 많이 고른 단어 5개. 진행자가 하나씩 넘깁니다 (2026.10.13) ── */
  .review{display:flex; flex-direction:column; gap:6px; padding:10px 16px}
  .review .rw{display:grid; grid-template-columns:2.2em 9em 8em 1fr; gap:14px; align-items:baseline;
              padding:8px 12px; cursor:pointer; border:1px solid transparent}
  .review .rw:hover{background:rgba(255,255,255,.07)}
  .review .rw.on{border-color:var(--fg)}
  .review .rw .w{font-family:"Galmuri11",monospace; font-size:20px}
  .review .rw .k{color:var(--dim); font-variant-numeric:tabular-nums}
  .review .rw .far{display:flex; gap:22px; flex-wrap:wrap}
  .review .rw .far span b{font-weight:400; color:var(--fg)}
  .review .rw .far span{color:var(--dim)}
  .review .nav{display:flex; gap:10px; justify-content:center; padding-top:14px}
  .review .nav button{background:transparent; color:var(--fg); border:1px solid var(--fg); padding:7px 22px}
  .review .nav button:disabled{color:var(--dim); border-color:var(--line); cursor:default}
  .review .note{color:var(--dim); text-align:center; padding-top:10px}
  .board::-webkit-scrollbar{width:6px}
  .board::-webkit-scrollbar-thumb{background:var(--line)}
  @keyframes rowin{0%{background:rgba(255,255,255,.55)} 100%{background:transparent}}
  li.new{animation:rowin .3s steps(3,end) 1}

  .final{flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center;
         gap:26px; letter-spacing:.12em}
  .found{display:flex; flex-direction:column; gap:6px; letter-spacing:.04em}
  .found div{display:flex; gap:14px; justify-content:center}
  .found .code{color:var(--dim); font-variant-numeric:tabular-nums; letter-spacing:.14em}


  .bottom{flex:0 0 auto; border-top:1px solid var(--line); padding:14px 0; text-align:center}
  #next{background:var(--fg); color:var(--bg); border:0; padding:9px 46px; letter-spacing:.1em; font-weight:600}

  #veil{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center;
        justify-content:center; z-index:9}
  #veil.on{display:flex}
  .modal{background:var(--bg); border:1px solid var(--fg); padding:32px 40px; min-width:430px;
         max-width:520px; text-align:center}
  .modal .l1{margin-bottom:14px; letter-spacing:.04em}
  .modal .l2{color:var(--dim); margin-bottom:28px}
  .modal .l2.warn{color:var(--fg); font-weight:600}
  .modal .btns{display:flex; gap:12px; justify-content:center}
  .modal .go{background:var(--fg); color:var(--bg); border:0; padding:8px 34px; font-weight:600}

  /* 연습용 흉내 인원 — 진짜 판에서는 안 누릅니다 */
  footer{flex:0 0 auto; border-top:1px solid var(--line); padding:8px 28px; display:flex;
         align-items:center; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--line); letter-spacing:.06em}
  footer button{font-size:12px; background:transparent; color:var(--line); border:1px solid var(--line); padding:3px 9px}
  footer button[aria-pressed="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}
</style>
<script src="bus.js?b=261014-4"></script>
<script src="settings.js?b=261014-4"></script>
<script src="data.js?b=261014-4"></script>
<script src="sphere-table.js?b=261012-7"></script>
<script src="sphere-lookup.js?b=261014-6"></script>
<script src="sphere.js?b=261013-3"></script>
</head>
<body>

<header>
  <span class="logo">디알렉티카</span>
  <span class="title" data-t="h.title"></span>
  <span class="right"><button class="ghost" id="screenBtn" data-t="h.screen_btn"></button></span>
</header>

<nav class="crumb" id="crumb"></nav>

<main>
  <div class="topline">
    <div class="hero" id="hero"></div>
    <div class="right">
      <button class="ghost" id="searchBtn" data-t="h.search"></button>
      <input id="searchBox" data-t="h.search_placeholder" hidden>
    </div>
  </div>
  <div class="board" id="board"></div>
</main>

<div class="bottom">
  <button id="next" data-t="common.next"></button>
</div>

<div id="veil">
  <div class="modal">
    <div class="l1" id="mL1"></div>
    <div class="l2" id="mL2"></div>
    <div class="btns">
      <button class="ghost" id="cancel" data-t="h.cancel"></button>
      <button class="go" id="go"></button>
    </div>
  </div>
</div>

<footer>
  <span data-t="h.mock_label"></span><span id="btns"></span><span id="gauge"></span>
</footer>

<script>
/* ─────────────────────────────────────────────────────────────────────────
   진행자 화면 = 장부의 주인 (2026.10.07)
   ⭐ 팀이 없어졌습니다 — 전부 개인전. 화면은 팀 3열 대신 이름이 들어온 순서대로 한 판입니다.
   ⭐ 셈은 여기 한 곳에서만 합니다. 폰은 「모았어요」·「썼어요」·「골랐어요」라고 말할 뿐입니다.
      · 입장 — 개인 코드(6자리 난수)를 여기서 정합니다. 출발 비율은 폰이 고른 5개를 받아 셉니다(DLK.startFrom, 2026.10.13)
      · 리뷰 — 수집 종료 = 리뷰 타임. 많이 고른 단어 5개와 단어마다 가장 먼 답 둘을 여기서 뽑아 장부에 올립니다(buildReview)
      · 수집 — 단어 하나 = 수집 점수 1(모은 개수). 게이지는 DLK.gauges가 셉니다
      ⛔ 창작·투표 단계는 없앴습니다(2026.10.13 사용자 "창작과 투표 단계 삭제"). 리뷰 → 결과로 바로 갑니다
   ⭐ 「모두 100」은 방 평균 막대로 봅니다 — 진행자는 그걸 보고 「다음」을 누릅니다.
   ───────────────────────────────────────────────────────────────────────── */
const SUR = "김이박최정강조윤장임한오서신권황안송전홍유고문양손배백허남심노하곽성차주우구";
const GIV = ["서연","지훈","수민","유진","하늘","도윤","서아","재현","지우","소율","준혁","예린",
             "민준","나윤","지호","채원","시우","현우","아름","은성","도현","수빈","가온","루하"];
const nameAt = k => SUR[k % SUR.length] + GIV[(k*7) % GIV.length];

/* people: {id, name, named, code, picks:[5], start, got:[{w,a,n}], at, mock} */
let people = [];
let stage = "entry";
let press = 0;
let timers = [];
const clearAll = () => { timers.forEach(clearTimeout); timers = []; };
const later = (fn, ms) => timers.push(setTimeout(fn, ms));

let picks = {};        /* 단어별 고른 수 — 입장 때 5개. 리뷰 타임의 순서 */
let review = null;     /* 리뷰 타임 — {list:[{w, n, ans:[{name, a, d}], far:[k, k]}], i}. i = -1 이면 5개를 함께 보는 첫 장 */
let words = {};        /* 단어별 수집 수 — 스크린 9.2 단어 순위 */
let seq = 0, gen = 0, gid = newGid();
let pair = null;                 /* 짝 — {list:[{ids,names,w,ans,d}], i, k, m} (2026.10.14) */
function newGid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
const ack = {};        /* 받아 적은 말의 번호 — 폰은 이걸 보고 다시 말하기를 그칩니다 */

const gOf  = p => DLK.gauges(p.start, p.got.map(x => x.w));

/* ── 「다음」 네 번과 「종료」 한 번 (8.1 · 2026.10.13 창작·투표 삭제 · 2026.10.14 짝 단계 추가) ── */
const PRESSES = [
  /* 문구는 엑셀 「문구」 시트 h.press.* (2026.10.14) */
  {at:"entry",   t:"collect", go:"common.next", act(){ stage = "collect"; runMockCollect(); }},
  {at:"collect", t:"review",  go:"common.next", warn:true, act(){ clearAll(); stage = "review"; buildReview(); }},
  {at:"review",  t:"pair",    go:"common.next", warn:true, act(){ clearAll(); stage = "pair"; buildPairs(); }},
  {at:"pair",    t:"result",  go:"common.next", warn:true, act(){ clearAll(); stage = "result"; }},
  /* 「종료」는 판을 닫고 새 판을 엽니다 — 플레이 테스트를 이어서 하기 위한 것입니다 */
  {at:"result",  t:"end",     go:"h.end",       warn:true, act(){ newGame(); }},
];
const ORDER = ["entry","collect","review","pair","result"];

/* 방 평균 — 이름을 낸 사람만 셉니다 */
function avg(){
  const P = people.filter(p => p.named && p.start);
  if(!P.length) return null;
  const s = [0,0,0], n = P.length;
  P.forEach(p => { const g = gOf(p); g.forEach((v,i) => s[i] += v); });
  return {g:s.map(v => Math.round(v/n))};
}

/* 사람 옆 숫자 — 그 단계에서 세는 것 */
function personNum(p){
  if(stage === "entry")   return p.start ? `<span>${p.start.join(" · ")}</span>` : `<span>${DLK.T("h.picking")}</span>`;
  if(stage === "collect" || stage === "review"){ const g = gOf(p);
    return `${DLK.T("h.got_count", {n:`<b>${p.got.length}</b>`})} &nbsp; ${g.join(" · ")}`; }
  return "";
}
const isDone = p => stage === "collect" ? gOf(p).every(v => v >= DLK.FULL) : false;

const board = document.getElementById("board");
const hero  = document.getElementById("hero");

function drawCrumb(){
  const names = ORDER.map(s => DLK.T("h.stage." + s));
  const now = ORDER.indexOf(stage);
  document.getElementById("crumb").innerHTML = names
    .map((n,i) => `<b class="${i === now ? "on" : ""}">${n}</b>`).join("<span>›</span>");
}
function drawHero(){
  const a = avg();
  const C = DLK.CHARS;
  if(stage === "entry") hero.innerHTML = `<span>${DLK.T("h.hero.joined", {n:`<span class="n">${people.length}</span>`})}</span>`;
  else if(stage === "collect") hero.innerHTML = a ? C.map((c,i) =>
      `<span><span class="k">${c.short}</span><span class="n">${a.g[i]}</span></span>`).join("")
      + `<span class="k">${DLK.T("h.hero.room_avg")}</span>` : "";
  else if(stage === "review") hero.innerHTML = review && review.list.length ?
      (review.i < 0 ? `<span><span class="k">${DLK.T("h.hero.review")}</span><span class="n">${review.top || 5}</span><span class="k">${DLK.T("h.hero.together")}</span></span>`
                    : `<span><span class="k">${DLK.T("h.hero.review")}</span><span class="n">${review.i + 1}</span><span class="k">/ ${review.list.length}</span></span>`) : "";
  else if(stage === "pair") hero.innerHTML = pair && pair.list.length ?
      `<span><span class="k">${DLK.T("h.hero.pair")}</span><span class="n">${pair.i + 1}</span><span class="k">/ ${pair.list.length}</span></span>` : "";
  else hero.innerHTML = "";
}

function draw(){
  if(stage === "result"){
    board.innerHTML = `<div class="final">${DLK.T("h.result_note")}<div class="found" id="found"></div></div>`;
  }else if(stage === "review"){
    drawReview();
  }else if(stage === "pair"){
    drawPairs();
  }else{
    board.innerHTML = `<ul id="ul"></ul>`;
    const ul = document.getElementById("ul");
    people.filter(p => p.named).forEach(p => ul.appendChild(row(p)));
  }
  document.getElementById("next").textContent = DLK.T(stage === "result" ? "h.end" : "common.next");
  drawCrumb(); drawHero(); applySearch(); gauge();
}
function row(p){
  const li = document.createElement("li");
  li.dataset.id = p.id; li.dataset.name = p.name;
  li.innerHTML = `<span>${DLK.esc(p.name)}</span><span class="code">${p.code}</span>`
               + `<span class="num">${personNum(p)}</span>`;
  li.classList.toggle("done", isDone(p));
  /* 이름 클릭 → 개인 코드 6자리 (재접속을 도울 때 읽어 줍니다 · 6.11) */
  li.onclick = () => li.classList.toggle("open");
  return li;
}
/* 그 사람의 줄과 위 숫자만 고칩니다 — 판을 다시 그리면 스크롤이 튑니다 */
function bump(p){
  const li = board.querySelector(`li[data-id="${p.id}"]`);
  if(li){
    li.querySelector(".num").innerHTML = personNum(p);
    li.classList.toggle("done", isDone(p));
    li.classList.remove("new"); void li.offsetWidth; li.classList.add("new");
  }
  drawHero(); gauge();
}

/* ══ 리뷰 타임 (2026.10.13 사용자) ═══════════════════════════════════════
   「사람들이 가장 많이 선택한 단어 5개를 하나씩 보여주는데 해당 단어에서 가장 거리가 먼 단어를
    입력한 두 사람을 소개하고 그 사람이 입력한 단어를 함께 보는 걸로 할게.」
   · 순서 — 입장 때 고른 수가 많은 단어 5개가 먼저(첫 장 목록도 이 5개). 같으면 먼저 고른 단어.
     ⭐그 뒤에 나머지 단어도 같은 화면으로 이어집니다(2026.10.13 사용자 "나머지 단어들도 똑같이 보여주면 좋겠어" ·
       "진행자용 화면에서 30개를 모두 보여주는 것이지") — 진행자 목록에 30개 전부, 고른 수 → 모인 답 수 → 포스터 순.
       답이 없는 단어도 목록에 남아 진행자가 고를 수 있고, 스크린엔 「모인 답 없음」이 뜹니다.
   · 가장 먼 둘 — ⭐답과 답 사이의 거리입니다(2026.10.13 사용자 "입력한 단어들 간의 거리가 가장 먼 사람을 골라 보여주는 거야.
     이게 내가 생각하는 원칙이야"). 포스터 단어의 구 안에서 답마다 자리(SPHERE.position)를 받아, 서로 가장 멀리 떨어진 한 쌍을 고릅니다.
     ⛔포스터 단어에서 먼 순으로 두 명을 고르던 첫 판은 폐기 — 같은 말을 쓴 둘이 「가장 먼 두 사람」으로 뽑혔습니다.
     같은 말은 같은 자리이므로, 고른 쌍과 같은 말을 쓴 사람은 전부 그 점에 함께 섭니다(far에 다 들어감).
     거리가 같으면 먼저 들어온 쌍. 답이 전부 같은 말이면 점 하나.
   · 지도 밖 답(어휘 5만에 없는 말)은 자리를 잴 수 없어 후보에서 뺍니다 — 오타·장난이 먼저 뽑히는 것을 막습니다
     (사용자 "오타와 장난 때문이라면 너의 판단에 따를게"). 점은 껍질 바깥에 그대로 찍힙니다.
   · 잴 수 있는 답이 하나뿐이면 한 사람만, 없으면 「모인 답 없음」 — 설계가 아니라 빈 화면을 막는 대비.
   · 첫 장은 5개를 함께 보는 목록(i = -1), 「다음 단어」로 1번부터 하나씩 (2026.10.13 사용자).           */
function buildReview(){
  const top = Object.entries(picks).filter(([,v]) => v.n > 0)
    .sort((a,b) => b[1].n - a[1].n || a[1].at - b[1].at).slice(0, 5).map(([w, v]) => ({w, n:v.n}));
  const rest = DLK.WORDS.map((x, i) => ({w:x.w, n:(picks[x.w] || {}).n || 0, at:(picks[x.w] || {}).at || 0, c:(words[x.w] || {}).n || 0, i}))
    .filter(x => !top.some(t => t.w === x.w))
    .sort((a, b) => b.n - a.n || (a.n && b.n ? a.at - b.at : 0) || b.c - a.c || a.i - b.i)
    .map(({w, n}) => ({w, n}));
  const list = [...top, ...rest].map(({w, n}) => {
    const ans = [], pos = [];
    people.filter(p => p.named).forEach(p => (p.got || []).forEach(x => {
      if(x.w !== w) return;
      let d = null, q = null; try { d = SPHERE.measure(w, x.a); q = SPHERE.position(w, x.a); } catch(e) { d = null; q = null; }
      ans.push({name:p.name, a:x.a, d}); pos.push(q);
    }));
    /* 답끼리 가장 먼 한 쌍 — 지도 안의 답만. 거리가 같으면 먼저 들어온 쌍 */
    const inMap = ans.map((_, k) => k).filter(k => pos[k]);
    let best = null, bd = -1;
    for(let i = 0; i < inMap.length; i++) for(let j = i + 1; j < inMap.length; j++){
      const a = pos[inMap[i]], b = pos[inMap[j]];
      const dd = (a[0]-b[0])**2 + (a[1]-b[1])**2 + (a[2]-b[2])**2;
      if(dd > bd + 1e-12){ bd = dd; best = [inMap[i], inMap[j]]; }
    }
    const seed = best && bd > 1e-12 ? best : inMap.slice(0, 1);          /* 쌍이 없거나 전부 같은 말이면 점 하나 */
    const words = new Set(seed.map(k => ans[k].a));
    const far = ans.map((x, k) => k).filter(k => pos[k] && words.has(ans[k].a));   /* 같은 말을 쓴 사람은 같은 점에 함께 */
    return {w, n, ans, far};
  });
  review = {list, top:top.length, i:-1};   /* 먼저 5개를 함께 본 뒤 하나씩 (2026.10.13 사용자 "응 그렇게 해줘"). top = 첫 장에 올리는 수 */
  sync();
}
function drawReview(){
  if(!review || !review.list.length){
    board.innerHTML = `<div class="review"><p class="note">${DLK.T("h.review.none")}</p></div>`;
    return;
  }
  const rows = review.list.map((r, k) => {
    const far = r.far.map(j => r.ans[j]).map(x => `<span><b>${DLK.esc(x.name)}</b> ${DLK.esc(x.a)}</span>`).join("");
    return `<div class="rw ${k === review.i ? "on" : ""}" data-k="${k}">`
      + `<span class="k">${k + 1}</span><span class="w">${DLK.esc(r.w)}</span>`
      + `<span class="k">${DLK.T("h.review.row_stat", {n:r.n, a:r.ans.length})}</span>`
      + `<span class="far">${far || `<span>${DLK.T("h.review.no_answers")}</span>`}</span></div>`;
  }).join("");
  const over = `<div class="rw ${review.i < 0 ? "on" : ""}" data-k="-1"><span class="k"></span><span class="w">${DLK.T("h.review.together")}</span>`
    + `<span class="k">${DLK.T("h.review.together_sub", {n:review.top || 5})}</span><span class="far"><span>${DLK.T("h.review.together_note", {n:review.top || 5, m:review.list.length - (review.top || 5)})}</span></span></div>`;
  board.innerHTML = `<div class="review">${over}${rows}<div class="nav">`
    + `<button id="rvPrev" ${review.i < 0 ? "disabled" : ""}>${DLK.T("h.review.prev")}</button>`
    + `<button id="rvNext" ${review.i >= review.list.length - 1 ? "disabled" : ""}>${DLK.T("h.review.next")}</button></div>`
    + `<p class="note">${DLK.T("h.review.note")}</p></div>`;
  board.querySelectorAll(".rw").forEach(el => el.onclick = () => setReview(+el.dataset.k));
  document.getElementById("rvPrev").onclick = () => setReview(review.i - 1);
  document.getElementById("rvNext").onclick = () => setReview(review.i + 1);
}
function setReview(i){
  if(!review) return;
  review.i = Math.max(-1, Math.min(review.list.length - 1, i));
  sync(); drawReview(); drawHero();
}

/* ══ 짝 — 답이 가장 먼 두 사람끼리 (2026.10.14 사용자) ═══════════════════════
   사용자 "플레이어들이 입력한 단어들만 가지고 거리를 재면 ... 이걸 30개의 포스터를 반복하면 평균값이 나오지 않아?"
   · 포스터마다 두 사람의 답 사이 거리(구 위 자리의 거리, 리뷰와 같은 잣대)를 재고, 같이 적은 포스터에 걸쳐 평균.
   · 사용자 "30명이 30단어를 다 입력하는 경우도 있고 그렇지 않을 수도 있어 이 변수를 계산해야 해."
     → 같이 적은 포스터 수 n이 적을수록 방 평균 m 쪽으로 당깁니다: (n·d + k·m)/(n+k), k = DLK.PAIR_K.
       겹침 0이면 정확히 m(중립). 지도 밖 답은 n에서 뺍니다.
   · 가장 먼 쌍부터 차례로 확정, 홀수면 마지막 한 사람을 **가장 먼 쌍**에 붙여 셋(10.12 놀공 답).
   · 발표: 사용자 "두 사람의 입력한 단어의 거리값이 가장 먼 포스터 단어와 함께 구 이미지" → 팀마다 그 포스터 하나.
     셋이면 세 사람 중 가장 먼 두 답의 포스터에 셋째 답도 같은 구에(안 적었으면 이름만). 사용자 "좋아. 진행해보자."
   · 한 쌍씩 넘깁니다(사용자 "한 쌍식 넘겨야 해").                                                            */
function buildPairs(){
  const P = people.filter(p => p.named);
  const pos = P.map(p => { const m = {};
    (p.got || []).forEach(x => { let q = null; try { q = SPHERE.position(x.w, x.a); } catch(e) {}
      if(q) m[x.w] = {q, a:x.a}; });
    return m; });
  const dist = (a, b) => Math.sqrt((a[0]-b[0])**2 + (a[1]-b[1])**2 + (a[2]-b[2])**2);
  /* 쌍마다 — 같이 적은 포스터의 거리들 */
  const pairs = [];
  let sum = 0, cnt = 0;
  for(let i = 0; i < P.length; i++) for(let j = i + 1; j < P.length; j++){
    const per = [];
    Object.keys(pos[i]).forEach(w => { if(pos[j][w]){ const d = dist(pos[i][w].q, pos[j][w].q); per.push({w, d}); sum += d; cnt++; } });
    const n = per.length, d = n ? per.reduce((s, x) => s + x.d, 0) / n : 0;
    pairs.push({i, j, n, d, per});
  }
  const m = cnt ? sum / cnt : 0, k = DLK.PAIR_K;
  pairs.forEach(x => { x.adj = (x.n * x.d + k * m) / (x.n + k); });
  pairs.sort((a, b) => b.adj - a.adj || b.n - a.n || a.i - b.i || a.j - b.j);
  const used = new Set(), teams = [];
  pairs.forEach(x => { if(used.has(x.i) || used.has(x.j)) return; used.add(x.i); used.add(x.j); teams.push([x.i, x.j]); });
  const left = P.map((_, i) => i).filter(i => !used.has(i));
  if(left.length && teams.length) teams[0].push(left[0]);          /* 홀수 — 가장 먼 쌍에 셋째로 */
  else if(left.length) teams.push([left[0]]);                        /* 혼자인 판 */
  const byIJ = {}; pairs.forEach(x => { byIJ[x.i + "," + x.j] = x; });
  const list = teams.map(t => {
    /* 팀 안의 쌍들 중 포스터 거리가 가장 큰 하나 */
    let best = null;
    for(let a = 0; a < t.length; a++) for(let b = a + 1; b < t.length; b++){
      const x = byIJ[Math.min(t[a], t[b]) + "," + Math.max(t[a], t[b])];
      (x ? x.per : []).forEach(y => { if(!best || y.d > best.d) best = {w:y.w, d:y.d}; });
    }
    const w = best ? best.w : null;
    const ans = t.map(i => ({ name:P[i].name, a: w && pos[i][w] ? pos[i][w].a : ((P[i].got || []).find(x => x.w === w) || {}).a || null }));
    const x2 = t.length >= 2 ? byIJ[Math.min(t[0], t[1]) + "," + Math.max(t[0], t[1])] : null;
    return { ids:t.map(i => P[i].id), names:t.map(i => P[i].name), w, d: best ? best.d : null, ans,
             n: x2 ? x2.n : 0, adj: x2 ? x2.adj : null };
  });
  pair = {list, i:0, k, m};
  sync();
}
function drawPairs(){
  if(!pair || !pair.list.length){
    board.innerHTML = `<div class="review"><p class="note">${DLK.T("h.pair.none")}</p></div>`;
    return;
  }
  const f = v => v == null ? "–" : v.toFixed(2);
  const rows = pair.list.map((t, k) =>
    `<div class="rw ${k === pair.i ? "on" : ""}" data-k="${k}">`
      + `<span class="k">${k + 1}</span><span class="w">${t.names.map(DLK.esc).join(" · ")}</span>`
      + `<span class="k">${t.w ? DLK.esc(t.w) : DLK.T("h.pair.no_word")}</span>`
      + `<span class="far">${t.ans.map(x => `<span><b>${DLK.esc(x.name)}</b> ${x.a == null ? DLK.T("h.pair.not_written") : DLK.esc(x.a)}</span>`).join("")}`
      + `<span>${DLK.T("h.pair.stat", {n:t.n, d:f(t.adj)})}</span></span></div>`).join("");
  board.innerHTML = `<div class="review">${rows}<div class="nav">`
    + `<button id="prPrev" ${pair.i <= 0 ? "disabled" : ""}>${DLK.T("h.pair.prev")}</button>`
    + `<button id="prNext" ${pair.i >= pair.list.length - 1 ? "disabled" : ""}>${DLK.T("h.pair.next")}</button></div>`
    + `<p class="note">${DLK.T("h.pair.note", {m:f(pair.m), k:pair.k})}</p></div>`;
  board.querySelectorAll(".rw").forEach(el => el.onclick = () => setPair(+el.dataset.k));
  document.getElementById("prPrev").onclick = () => setPair(pair.i - 1);
  document.getElementById("prNext").onclick = () => setPair(pair.i + 1);
}
function setPair(i){
  if(!pair) return;
  pair.i = Math.max(0, Math.min(pair.list.length - 1, i));
  sync(); drawPairs(); drawHero();
}

/* ══ 장부 ═══════════════════════════════════════════════════════════════ */
function sync(){
  Bus.publish({
    players: people.map(p => ({
      id:p.id, name:p.named ? p.name : "", code:p.code, picks:p.picks, start:p.start,
      got:p.got, cnt:p.got.length, g:gOf(p), at:p.at || 0
    })),
    picks, review, pair, words, gen, gid, ack
  });
}
function remember(id, kind, n){
  const a = ack[id] || (ack[id] = {p:[]});
  if(!a[kind].includes(n)) a[kind].push(n);
}
/* 개인 코드 — 6자리 난수. 겹치지 않게 */
function newCode(){
  let c;
  do { c = String(100000 + Math.floor(Math.random()*900000)); } while(people.some(p => p.code === c));
  return c;
}

function joinReal(id, mock){
  if(people.some(p => p.id === id)) return null;   /* 새로고침해도 두 번 들어오지 않는다 */
  const p = {id, name:"", named:false, code:newCode(), picks:null, start:null,
             got:[], at:0, mock:!!mock};
  people.push(p);
  sync(); drawHero(); gauge();
  return p;
}
function nameReal(id, name){
  const p = people.find(q => q.id === id);
  if(!p || !name) return;
  const first = !p.named;
  p.name = String(name).slice(0, 20); p.named = true;
  sync();
  if(first && stage !== "result"){
    const ul = document.getElementById("ul");
    if(ul){ const li = row(p); li.classList.add("new"); ul.appendChild(li); applySearch(); }
  }
  drawHero(); gauge();
}
/* 폰이 5개를 다 골랐을 때 — 비율을 세어 장부에. 두 번 와도 처음 것만 */
function pickReal(id, list){
  const p = people.find(q => q.id === id);
  if(!p) return;
  const ws = Array.isArray(list) ? list.filter(w => DLK.WORDS.some(o => o.w === w)) : [];
  if(ws.length !== DLK.PICK_N || new Set(ws).size !== ws.length){ sync(); return; }
  if(p.picks){ sync(); return; }
  p.picks = ws; p.start = DLK.startFrom(ws); p.at = ++seq;
  ws.forEach(w => { const k = picks[w] || (picks[w] = {n:0, at:0}); k.n++; if(!k.at) k.at = seq; });
  bump(p); sync();
}
/* 폰이 단어 하나를 모을 때마다 */
function collectReal(id, nth, w, a){
  const p = people.find(q => q.id === id);
  if(!p) return;
  remember(id, "p", nth);
  const x = DLK.WORDS.find(o => o.w === w);
  if(!x || p.got.some(o => o.w === w)){ sync(); return; }   /* 없는 단어 · 이미 모은 단어 */
  p.got.push({w, a:String(a || "").slice(0, 60), n:nth});
  p.at = ++seq;
  const k = words[w] || (words[w] = {n:0, at:0});
  k.n++; k.at = seq;
  bump(p); sync();
}
Bus.onSay(msg => {
  if(!msg) return;
  if(msg.join) joinReal(msg.join.id);
  if(msg.name) nameReal(msg.name.id, msg.name.name);
  if(msg.pick) pickReal(msg.pick.id, msg.pick.words);
  if(msg.collect) collectReal(msg.collect.id, msg.collect.nth, msg.collect.w, msg.collect.a);
});

/* ── 확인 팝업 ── */
const veil = document.getElementById("veil");
document.getElementById("next").onclick = () => {
  const P = PRESSES[press];
  if(!P) return;
  document.getElementById("mL1").textContent = DLK.T("h.press." + P.t + ".l1");
  const l2 = document.getElementById("mL2");
  l2.textContent = DLK.T("h.press." + P.t + ".l2"); l2.classList.toggle("warn", !!P.warn);
  document.getElementById("go").textContent = DLK.T(P.go);
  veil.classList.add("on");
};
document.getElementById("cancel").onclick = close;
veil.onclick = e => { if(e.target === veil) close(); };
addEventListener("keydown", e => { if(e.key === "Escape") close(); });
function close(){ veil.classList.remove("on"); }
document.getElementById("go").onclick = () => {
  close();
  const P = PRESSES[press++];
  P.act(); draw();
  Bus.set(press);                 /* 스크린과 참가자 폰이 같은 신호로 따라옵니다 (8.1) */
};
/* 스크린 — 새 창으로 공용 화면. 사고 복구용이라 **지금 단계**의 화면으로 엽니다 */
document.getElementById("screenBtn").onclick = () => open(Bus.screenAt(press), "dialectica-screen");

/* ── 이름 검색 — 안 걸린 이름을 흐리게 ── */
const searchBtn = document.getElementById("searchBtn");
const searchBox = document.getElementById("searchBox");
searchBtn.onclick = () => { searchBtn.hidden = true; searchBox.hidden = false; searchBox.focus(); };
searchBox.oninput = applySearch;
searchBox.onkeydown = e => { if(e.key === "Escape") closeSearch(); };
searchBox.onblur = () => { if(!searchBox.value) closeSearch(); };
function closeSearch(){ searchBox.value = ""; searchBox.hidden = true; searchBtn.hidden = false; applySearch(); }
function applySearch(){
  const q = searchBox.hidden ? "" : searchBox.value.trim();
  document.querySelectorAll(".board li").forEach(li =>
    li.classList.toggle("miss", !!q && !li.dataset.name.includes(q)));
  const found = document.getElementById("found");
  if(found) found.innerHTML = !q ? "" : people.filter(p => p.named && p.name.includes(q)).slice(0,8)
    .map(p => `<div><span>${DLK.esc(p.name)}</span><span class="code">${p.code}</span></div>`).join("");
}

/* ── 새 판 — 장부를 비우고 판 번호를 올립니다. 폰은 그 번호를 보고 처음으로 돌아갑니다 ── */
let noted = "";
function newGame(){
  clearAll();
  people = []; picks = {}; review = null; pair = null; words = {};
  Object.keys(ack).forEach(k => delete ack[k]);
  seq = 0; stage = "entry"; press = 0;
  noted = DLK.T("h.new_game");
  gen++; gid = newGid();
  Bus.publish({press:0, players:[], picks:{}, review:null, pair:null, words:{}, gen, gid, ack:{}});
  draw();
}

/* ══ 연습용 흉내 인원 ═══════════════════════════════════════════════════
   혼자서 스크린과 진행자 화면을 돌려 보려고 둔 것입니다. 진짜 폰과 같은 길(joinReal ·
   nameReal · pickReal · collectReal)로 들어가므로 셈도 장부도 진짜와 똑같습니다.
   ⛔ 진짜 판에서는 누르지 마세요 — 장부에 가짜 사람이 섞입니다.                    */
/* 조건이 Opposite 하나로 통일된 뒤(2026.10.07 오후) 흉내 답도 하나의 목록 — 지도 밖 답(ㅋㅋ)도 섞어 둡니다 */
const ANS = {"Opposite":["외면","안주","연결","사건","새로운 시도","기계 중심","정체","두려움","무관심","고정","파괴",
                         "침묵","익숙함","바나나","ㅋㅋ","차가움","현실","복종","단절","소음"]};
const pick = a => a[Math.floor(Math.random()*a.length)];
let mockN = 0;
function addMocks(n){
  for(let i = 0; i < n; i++){
    later(() => {
      const k = mockN++;
      const p = joinReal("mock" + gen + "_" + k, true);
      if(p) later(() => {
        nameReal(p.id, nameAt(k));
        /* 판마다 하나씩 — 진짜 폰과 같은 판(DLK.pickRounds)에서 고릅니다 */
        later(() => pickReal(p.id, DLK.pickRounds(p.id).map(r => pick(r))), 600 + Math.random()*2000);
      }, 400 + Math.random()*1600);
    }, i * (120 + Math.random()*200));
  }
}
function runMockCollect(){
  people.filter(p => p.mock).forEach(p => {
    const goal = 6 + Math.floor(Math.random()*12);
    const order = DLK.WORDS.slice().sort(() => Math.random() - .5).slice(0, goal);
    order.forEach((x, k) => later(() => collectReal(p.id, k+1, x.w, pick(ANS[x.c])),
                                  1500 + k*(1500 + Math.random()*2500)));
  });
}
const btns = document.getElementById("btns");
[3, 12, 30].forEach(n => {
  const b = document.createElement("button");
  b.textContent = DLK.T("h.mock_add", {n});
  b.onclick = () => { if(stage === "entry") addMocks(n); };
  btns.appendChild(b);
});
function gauge(){
  const label = DLK.T("h.stage." + stage);
  document.getElementById("gauge").textContent =
    `판 ${Bus.build}/${Bus.mode()} · ${label} · 접속 ${people.length}명 · 이름 ${people.filter(p=>p.named).length}명`
    + (noted ? ` · ${noted}` : "");
}

/* ⛔ 진행자가 실수로 새로고침해도 판이 날아가면 안 됩니다.
      장부에 이미 사람이 있으면 그것을 이어받고, 비어 있을 때만 새로 엽니다. */
let booted = false;
Bus.onState(b => {
  if(booted) return;
  booted = true;
  if(b.players && b.players.length){
    people = b.players.map(p => ({
      id:p.id, name:p.name, named:!!p.name, code:p.code, picks:p.picks || null, start:p.start || null,
      got:p.got || [], at:p.at || 0, mock:String(p.id).startsWith("mock")
    }));
    picks = b.picks || {}; review = b.review || null; pair = b.pair || null;
    words = b.words || {}; gen = b.gen || 0; gid = b.gid || gid;
    Object.assign(ack, b.ack || {});
    seq = Math.max(0, ...people.map(p => p.at || 0));
    press = b.press || 0;
    stage = press < PRESSES.length ? PRESSES[press].at : "result";
    noted = DLK.T("h.resumed", {n:people.length});
    draw();
  }else{
    Bus.publish({press:0, players:[], picks:{}, review:null, pair:null, words:{}, gen, gid, ack:{}});
  }
});
draw();
</script>
