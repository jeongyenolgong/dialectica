<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
<title>디알렉티카 — 투표 · 결과</title>
<link rel="stylesheet" href="font.css?b=261007-1">
<link rel="stylesheet" href="phone.css?b=261012-1">
<style>
  .cards{display:flex; flex-direction:column; gap:18px; margin-top:22px; width:100%; max-width:340px}
  .vcard{min-height:150px; padding:16px; border:2px solid var(--name); background:var(--bg);
         font-size:21px; line-height:1.5; word-break:keep-all; overflow-wrap:anywhere; text-align:left;
         display:flex; flex-direction:column; color:var(--name);
         transition:opacity .3s steps(3), transform .3s steps(3)}
  .vcard.pick{background:var(--name); color:var(--bg)}
  .vcard.pick .je{background:var(--bg); color:var(--name)}
  .vcard.gone{opacity:0; transform:translateX(-40px)}
  .vcard.enter{opacity:0; transform:translateX(40px)}
  .by{margin-top:auto; padding-top:10px; font-size:16px; color:var(--line)}
  .vcard.pick .by{color:var(--bg)}
  .pos{margin-top:18px; font-size:20px; letter-spacing:.1em}
  /* 결과 — 표를 가장 많이 받은 문장 다섯 */
  .rank{width:100%; max-width:340px; display:flex; gap:10px; align-items:flex-start; margin-top:14px}
  .rank .no{font-size:20px; width:1.8em; flex:0 0 auto; padding-top:12px}
  .rcard{flex:1 1 auto; padding:12px; border:2px solid var(--name); font-size:19px; line-height:1.5;
         word-break:keep-all; overflow-wrap:anywhere}
  .rcard .by{font-size:15px}
  .rank.mine .rcard{background:var(--name); color:var(--bg)}
  .rank.mine .rcard .je{background:var(--bg); color:var(--name)}
  .rank.mine .rcard .by{color:var(--bg)}
</style>
<script src="bus.js?b=261013-3"></script>
<script src="data.js?b=261013-1"></script>
<script src="phone.js?b=261007-1"></script>
</head>
<body>
<!-- ─────────────────────────────────────────────────────────────────────
     P8 투표 · P9 결과 (2026.10.07)
     P8 — 두 문장 중 더 좋은 것을 고릅니다. 짝은 진행자 화면이 미리 다 짜 둡니다(7.4).
          내 문장은 나오지 않습니다. 팀이 없어져 「우리 팀 문장 빼기」는 사라졌습니다.
          ⭐ 투표는 게이지를 올리지 않습니다(사용자 "게이지 상승 같은 건 없고").
     P9 — 표를 가장 많이 받은 문장 **다섯**을 함께 리뷰합니다. 최종 누적 순위는 없습니다.
     ───────────────────────────────────────────────────────────────────── -->
<div class="phone">
  <div class="head"><span class="ttl">디알렉티카</span></div>
  <div class="strip" id="strip"></div>
  <main>
    <section class="view on"><div class="mid" id="main"></div></section>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const ME = Bus.me();
const gs = PH.strip($("#strip"), true);
const wantP9 = new URLSearchParams(location.search).get("v") === "9";
let book = Bus.state(), duels = null, round = 0, live = false, onP9 = false;

/* 문장 안 표기 — 포스터 단어는 흰 블록, 내가 쓴 말은 밑줄 */
function markup(x){
  let h = DLK.esc(x.text);
  if(x.a) h = h.replace(DLK.esc(x.a), `<span class="je">${DLK.esc(x.a)}</span>`);      /* 포스터 단어 — 흰 블록 */
  if(x.b) h = h.replace(DLK.esc(x.b), `<span class="ban">${DLK.esc(x.b)}</span>`);     /* 내가 쓴 말 — 밑줄 */
  return h;
}
const S = i => (book.sentences || [])[i] || {text:"", a:"", b:"", name:""};

/* ── P8 ── */
function deal(){
  if(round >= duels.length) return done();
  const pair = duels[round];
  $("#main").innerHTML = `<p class="guide">더 좋은 문장을 고르세요</p><div class="cards" id="cards"></div>`
    + `<p class="pos">${String(round+1).padStart(2,"0")} / ${String(duels.length).padStart(2,"0")}</p>`;
  pair.forEach((i, k) => {
    const x = S(i);
    const c = document.createElement("button");
    c.className = "vcard enter";
    c.innerHTML = `<div>${markup(x)}</div><div class="by">${DLK.esc(x.name)}</div>`;
    c.onclick = () => choose(k);
    $("#cards").appendChild(c);
  });
  setTimeout(() => document.querySelectorAll(".vcard.enter").forEach(c => c.classList.remove("enter")), 20);
}
/* 고른 카드가 반전된 채 머물고(0.9초), 두 장이 함께 사라집니다 (2026.08.13) */
function choose(k){
  const cards = [...document.querySelectorAll(".vcard")];
  cards.forEach(c => c.onclick = null);
  cards[k].classList.add("pick");
  const r = round;
  Bus.sayUntil({vote:{id:ME, k:r, win:duels[r][k]}},
               b => ((((b.ack||{})[ME]||{}).v)||[]).includes(r));
  setTimeout(() => cards.forEach(c => c.classList.add("gone")), 900);
  setTimeout(() => { round++; deal(); }, 1200);
}
function done(){
  $("#main").innerHTML = `<p class="guide" style="font-size:30px">투표 완료</p>`
    + `<p class="sub" style="margin-top:18px">결과 발표를 기다려 주세요</p>`;
}

/* ── P9 — 함께 볼 문장 다섯 ── */
function render9(){
  onP9 = true;
  const W = book.wins || [];
  const top = (book.sentences || []).map((x, i) => ({x, n:W[i] || 0, i}))
    .sort((a, c) => c.n - a.n || a.i - c.i).slice(0, 5);
  $("#main").innerHTML = `<p class="guide">가장 많은 표를 받은 문장</p>`
    + (top.length ? "" : `<p class="sub" style="margin-top:20px">문장이 없습니다</p>`)
    + top.map((o, k) => `<div class="rank${o.x.by === ME ? " mine" : ""}">`
        + `<span class="no">${String(k+1).padStart(2,"0")}</span>`
        + `<div class="rcard">${markup(o.x)}<div class="by">${DLK.esc(o.x.name)}</div></div></div>`).join("");
}

Bus.onState(b => {
  book = b;
  const st = PH.state(b);
  gs.set(st.g, st.ou);
  if(wantP9){ render9(); return; }
  const d = (b.duels || {})[ME];
  if(d && !live){
    live = true; duels = d;
    const me = Bus.mine(b);
    round = Math.min(d.length, (me && me.votes) || 0);
    if(!d.length){ $("#main").innerHTML = `<p class="guide">이번 투표에는 고를 짝이 없습니다</p>`; return; }
    deal();
  }
});
if(!wantP9) $("#main").innerHTML = `<p class="guide">투표를 준비하는 중</p>`;
</script>
</body>
</html>
