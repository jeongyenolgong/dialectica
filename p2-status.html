<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
<title>디알렉티카 — 내 상태</title>
<link rel="stylesheet" href="font.css?b=261007-1">
<link rel="stylesheet" href="phone.css?b=261014-7">
<style>
  /* 출발 비율 — 화면의 주인공이라 크게 그립니다 */
  .big{width:100%; max-width:340px; display:flex; flex-direction:column; gap:22px; margin-top:30px}
  .big .r{display:flex; flex-direction:column; gap:8px}
  .big .top{display:flex; justify-content:space-between; align-items:baseline; font-size:20px}
  .big .top .v{font-size:28px; color:var(--gc); font-variant-numeric:tabular-nums}
  .big .bar{display:grid; grid-template-columns:repeat(10,1fr); gap:4px; height:22px}
  .big .bar i{display:block; background:var(--dim)}
  .big .bar i.on{background:var(--gc)}
  #who{font-size:20px; color:var(--line); min-height:1.4em}
  #next{visibility:hidden; margin-top:34px}
</style>
<script src="bus.js?b=261014-7"></script>
<script src="settings.js?b=261014-7"></script>
<script src="data.js?b=261014-7"></script>
<script src="phone.js?b=261014-7"></script>
</head>
<body>
<!-- ─────────────────────────────────────────────────────────────────────
     P2 내 상태 — 입장 때 고른 5개에서 나온 세 캐릭터의 출발 비율을 보여 줍니다 (2026.10.13)
     비율 = 고른 다섯의 캐릭터별 개수 비율(DLK.pct). 진행자 화면이 세어 장부에 적습니다(DLK.startFrom).
     ⛔ 10.07의 난수 비율(합 100 · 10 단위 · 10~70)은 폐기.
     ⛔ 「단어를 모아 세 게이지를 모두 100으로 채우세요」 안내는 뺐습니다(2026.10.13 사용자 "삭제").
     ───────────────────────────────────────────────────────────────────── -->
<div class="phone">
  <div class="head"><span class="ttl">디알렉티카</span></div>
  <main>
    <section class="view on">
      <div class="mid">
        <p id="who"></p>
        <p class="guide" id="guide" style="margin-top:10px"></p>
        <div class="big" id="big"></div>
        <button class="btn" id="next" data-t="common.next"></button>
      </div>
    </section>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
let shown = false;

$("#big").innerHTML = DLK.CHARS.map(c =>
  `<div class="r" style="--gc:${c.color}"><div class="top"><span>${c.ko}</span><span class="v"></span></div>`
  + `<div class="bar">${"<i></i>".repeat(10)}</div></div>`).join("");

function paint(vals){
  [...$("#big").children].forEach((r, i) => {
    const v = vals[i];
    r.querySelector(".v").textContent = v == null ? "" : v;
    [...r.querySelectorAll(".bar i")].forEach((b, k) => b.classList.toggle("on", v != null && v >= (k+1)*10));
  });
}

/* 연출 — 「당신을 읽는 중」이 점 셋을 두 바퀴 돌 동안(약 2.6초) 머물고, 그 뒤 세 막대가 한 칸씩 차오릅니다.
   (2026.10.13 사용자 "당신을 읽는 중은 화면에서 너무 금방 사라져 … 조금 더 지속되어야 해") 번쩍임 없음 */
const READ_MS = 2600, DOT_MS = 400;
function reveal(start, name){
  if(shown) return; shown = true;
  $("#who").textContent = name ? DLK.T("p2.who", {name}) : "";
  const g = $("#guide");
  g.textContent = DLK.T("p2.reading");
  for(let n = 1; n * DOT_MS < READ_MS; n++) PH.later(n*DOT_MS, () => g.textContent = DLK.T("p2.reading") + "·".repeat((n - 1) % 3 + 1));
  const A = READ_MS;
  for(let k = 1; k <= 7; k++)
    PH.later(A + k*120, () => paint(start.map(v => Math.min(v, k*10))));
  PH.later(A + 7*120 + 100, () => {
    paint(start);
    g.textContent = DLK.T("p2.start");
  });
  PH.later(A + 7*120 + 500, () => { $("#next").style.visibility = "visible"; });
}

$("#next").onclick = () => Bus.go("p3-wait.html");

/* 비율이 오기 전 — 「당신을 읽는 중」만 보입니다. 「연결하는 중」 같은 말은 참가자에게 보이지 않습니다(2026.10.13 사용자).
   진행자 화면이 고르기 말을 못 들었으면 폰 쪽지의 5개로 닿을 때까지 다시 말합니다 */
let asked = false;
$("#guide").textContent = DLK.T("p2.reading");
Bus.onState(b => {
  const me = Bus.mine(b);
  if(!me) return;
  if(me.start){ reveal(me.start, me.name); return; }
  if(!asked){
    const picks = PH.load("dlk.picks." + Bus.me(), []);
    if(picks.length === DLK.PICK_N){ asked = true; Bus.sayUntil({pick:{id:me.id, words:picks}}, bb => !!(Bus.mine(bb) || {}).start); }
  }
});
</script>
</body>
</html>
