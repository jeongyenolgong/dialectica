<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
<title>디알렉티카 — 재접속</title>
<link rel="stylesheet" href="font.css?b=261007-1">
<link rel="stylesheet" href="phone.css?b=261014-7">
<style>
  .slots{display:flex; gap:8px; margin-top:28px}
  .slots .gap{width:10px}
  .sl{width:40px; height:56px; border:2px solid var(--line); display:flex; align-items:center;
      justify-content:center; font-size:28px; line-height:1}
  .sl.full{border-color:var(--name)}
  .sl.hit{background:var(--name); color:var(--bg); border-color:var(--name)}
  /* 숫자판 — 자판이 아예 안 올라옵니다 */
  .pad{display:grid; grid-template-columns:repeat(3,84px); gap:10px; margin-top:28px}
  .pad button{font-size:24px; height:54px; background:transparent; color:var(--name);
              border:2px solid var(--line)}
  .pad button.small{font-size:18px}
  .pad button.off{color:var(--dim); border-color:var(--dim)}
  #welcome{font-size:24px; min-height:1.4em; margin-top:24px; text-align:center}
  #nextBtn{visibility:hidden}
</style>
<script src="bus.js?b=261014-10"></script>
<script src="settings.js?b=261014-7"></script>
<script src="data.js?b=261014-10"></script>
<script src="phone.js?b=261014-7"></script>
</head>
<body>
<!-- ─────────────────────────────────────────────────────────────────────
     재접속 — 폰 기록을 날린 사람이 자기 기록으로 돌아오는 길입니다.
     **재접속 QR로만** 들어옵니다(초대장 QR과 따로 — 2026.10.07 사용자 "분리해").
     개인 코드 6자리는 진행자 화면에서만 보이고, 진행자가 얼굴을 보고 알려 줍니다.
     ⭐ 코드가 맞으면 이 폰에 그 사람의 이름표를 붙입니다. 모은 단어 · 쓴 문장은 장부에서 되돌아옵니다.
     ⭐ 복귀 확인에 이름이 꼭 들어갑니다 — 남의 코드를 받아 들어왔을 때 알아챌 유일한 자리입니다.
     ───────────────────────────────────────────────────────────────────── -->
<div class="phone">
  <div class="head"><span class="ttl">디알렉티카</span></div>
  <main>
    <section class="view on">
      <div class="mid">
        <p class="guide" id="guide"></p>
        <div class="slots" id="slots"></div>
        <p class="msg" id="msg"></p>
        <div class="pad" id="pad"></div>
        <p id="welcome"></p>
        <button class="btn" id="nextBtn" data-t="common.next"></button>
      </div>
    </section>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
let code = "", done = false, book = Bus.state(), found = null;

function paintSlots(hit){
  const box = $("#slots"); box.innerHTML = "";
  for(let i = 0; i < 6; i++){
    if(i === 3){ const g = document.createElement("span"); g.className = "gap"; box.appendChild(g); }
    const s = document.createElement("span");
    s.className = "sl" + (hit ? " hit" : (code[i] ? " full" : ""));
    s.textContent = code[i] || "";
    box.appendChild(s);
  }
}
function paintPad(){ $("#pad").querySelector('[data-k="ENT"]').classList.toggle("off", code.length < 6); }
["1","2","3","4","5","6","7","8","9","DEL","0","ENT"].forEach(k => {
  const b = document.createElement("button");
  b.textContent = k; b.dataset.k = k;
  if(k === "DEL" || k === "ENT") b.className = "small";
  b.onclick = () => press(k);
  $("#pad").appendChild(b);
});
function press(k){
  if(done) return;
  if(k === "DEL"){ code = code.slice(0, -1); paintSlots(); paintPad(); return; }
  if(k === "ENT") return enter();
  if(code.length >= 6) return;
  code += k; paintSlots(); paintPad();
}
function enter(){
  if(code.length < 6) return;
  const who = (book.players || []).find(p => p.code === code && p.name);
  if(!who){
    $("#msg").textContent = Bus.mode() === "찾는 중" ? DLK.T("common.wait") : DLK.T("rc.not_found");   /* 「연결하는 중」은 참가자에게 안 보입니다(2026.10.13) */
    PH.shake($("#slots"));
    setTimeout(() => { code = ""; paintSlots(); paintPad(); }, 320);
    setTimeout(() => $("#msg").textContent = "", 1600);
    return;
  }
  done = true; found = who;
  $("#msg").textContent = "";
  paintSlots(true);
  /* 이 폰에 그 사람의 이름표를 붙입니다 — 폰 쪽지는 장부에서 다시 채웁니다 */
  Bus.becomeMe(who.id);
  PH.save("dlk.pairs." + who.id, who.got || []);
  PH.typeOut($("#welcome"), DLK.T("rc.welcome", {name:who.name}), 60, () => $("#nextBtn").style.visibility = "visible");
  $("#pad").style.visibility = "hidden";
}
/* 「다음」 — 지금 진행 중인 단계의 화면으로 */
$("#nextBtn").onclick = () => Bus.go(Bus.phoneAt(book.press || 0));

Bus.onState(b => { book = b; });
paintSlots(); paintPad();
PH.typeOut($("#guide"), DLK.T("rc.guide"), 50);
</script>
</body>
</html>
