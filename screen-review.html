<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store">
<title>디알렉티카 — 스크린 · 리뷰</title>
<link rel="stylesheet" href="font.css?b=261007-1">
<link rel="stylesheet" href="screen.css?b=261007-1">
<style>
  [hidden]{display:none !important}   /* grid·flex 규칙에 숨김이 지지 않게 */
  /* ── 한 단어 화면 — 왼쪽 단어·숫자, 가운데 구(가장 먼 두 사람의 말·이름), 오른쪽 나머지 전원의 이름·말 ── */
  .rv{flex:1 1 auto; min-height:0; display:grid; grid-template-columns:1fr auto 1.4fr; gap:2.5vw;
      align-items:center; padding:2vh 0 1vh}
  .rv .left, .rv .right{display:flex; flex-direction:column; min-width:0}
  .rv .left{align-items:flex-start; gap:3vh}
  .rv .right{align-items:flex-start; gap:2vh; max-height:72vh}
  /* 나머지 사람들 — 14줄씩 세로로 채우고 넘치면 옆 열로(최대 30명 → 두 열). 들어온 순서 */
  .rest{display:grid; grid-auto-flow:column; grid-template-rows:repeat(14, auto); column-gap:2.5vw; row-gap:.9vh; max-width:100%}
  .rest .p{display:flex; align-items:baseline; gap:.7em; min-width:0; line-height:1.25}
  .rest .nm{flex:0 0 auto; font-size:18px; color:var(--line); letter-spacing:.04em}
  .rest .a{font-size:var(--rank); word-break:keep-all}
  /* 목록 맨 위 — 가장 먼 두 사람(구의 민트 점과 같은 색) (2026.10.14 사용자 「다른 사람들의 이름과 단어가 나오는 부분 맨 위에」) */
  .far{display:flex; flex-direction:column; gap:.9vh; padding-bottom:1.6vh; border-bottom:1px solid var(--dim); width:100%}
  .far:empty{display:none}
  .far .p{display:flex; align-items:baseline; gap:.7em; line-height:1.25}
  .far .nm{flex:0 0 auto; font-size:18px; color:rgb(95,230,176); letter-spacing:.04em}
  .far .a{font-size:var(--rank); color:rgb(95,230,176); word-break:keep-all}
  #no{font-size:var(--sub); color:var(--line); letter-spacing:.1em; font-variant-numeric:tabular-nums}
  #w{font-size:var(--stage); background:var(--name); color:var(--bg); padding:.1em .35em; word-break:keep-all; line-height:1.2}
  .k{font-size:var(--rank); color:var(--line); letter-spacing:.06em; line-height:1.6}
  .k b{font-weight:400; color:var(--name); font-variant-numeric:tabular-nums}
  #cv{display:block; width:min(66vh, 38vw); height:min(66vh, 38vw)}
  #empty{position:absolute; inset:0; display:none; align-items:center; justify-content:center;
         font-size:var(--sub); color:var(--line); letter-spacing:.1em}
  .mid{position:relative}
  #idle{flex:1 1 auto; display:flex; align-items:center; justify-content:center; font-size:var(--title); color:var(--line); letter-spacing:.2em}
  /* ── 첫 장 — 판마다 한 줄: 그 판에서 가장 많이 고른 단어를 크게, 나머지 다섯은 고른 수 순서로 옆에 (2026.10.14 사용자) ── */
  #ov{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3.2vh}
  #ov h2{padding-bottom:1vh}
  #ov .r{display:grid; grid-template-columns:calc(var(--rank)*1.5) calc(var(--stage)*6.5 + var(--rank)*3) 1fr; gap:2vw; align-items:baseline; width:min(92vw, 1500px)}
  #ov .r .k{font-size:var(--rank); color:var(--line); text-align:right; font-variant-numeric:tabular-nums}
  #ov .r .top{display:flex; align-items:baseline; gap:.6em; min-width:0}
  #ov .r .w{font-size:var(--stage); background:var(--name); color:var(--bg); padding:.08em .35em; word-break:keep-all; white-space:nowrap}
  #ov .r .n{font-size:var(--rank); color:var(--line); font-variant-numeric:tabular-nums; white-space:nowrap}
  #ov .r .n b{font-weight:400; color:var(--name)}
  #ov .r .rest5{display:flex; flex-wrap:wrap; align-items:baseline; column-gap:1.6em; row-gap:.4em; font-size:var(--rank)}
  #ov .r .rest5 span{white-space:nowrap}
  #ov .r .rest5 b{font-weight:400; color:var(--line); margin-left:.35em; font-variant-numeric:tabular-nums}
</style>
<script src="bus.js?b=261014-10"></script>
<script src="settings.js?b=261014-7"></script>
<script src="data.js?b=261014-10"></script>
<script src="sphere-table.js?b=261012-7"></script>
<script src="sphere-lookup.js?b=261014-6"></script>
<script src="sphere.js?b=261014-7"></script>
<script src="screen.js?b=261014-7"></script>
</head>
<body>
<!-- ─────────────────────────────────────────────────────────────────────
     스크린 리뷰 타임 (2026.10.13 사용자) — 수집 종료 뒤 · 짝 전. 폰은 대기. 첫 장은 많이 고른 5개 목록, 그다음 포스터 단어 30개를 하나씩.
     「사람들이 가장 많이 선택한 단어 5개를 하나씩 보여주는데 해당 단어에서 가장 거리가 먼 단어를
      입력한 두 사람을 소개하고 그 사람이 입력한 단어를 함께 보는 걸로 할게.」
     · 단어 하나 = 포스터 단어 + 고른 사람 수 + 모인 답 수 + 그 단어의 거리 구에 답 전부를 점으로(흰 점)
       + 가장 먼 답 둘을 민트 점에 적은 말·이름으로, 오른쪽 목록 맨 위에 그 둘을 민트로 한 번 더(2026.10.14 사용자), 그 아래 **나머지 전원**의 이름과 적은 말을 들어온 순서로(최대 30명, 14줄씩 두 열).
       (2026.10.13 사용자 "구에서는 가장 거리가 먼 두 사람의 이름과 그 단어가 나오고 그 옆에 나머지 사람들의 이름과 그들이 입력한 단어")
       ⭐목록에는 지도 밖 답(오타·장난)도 남들과 똑같이 적습니다(2026.10.13 사용자 "장난이나 오답이라도 다 표기되어야 해").
       「리뷰 REVIEW」 제목 줄과 「나머지 N명」 글자는 뺌(2026.10.13 사용자).
     · 어느 단어를 띄울지는 진행자 화면(장부 review.i)이 정합니다. 여기는 보여 주기만.
     · review.i = -1 이면 첫 장: 입장 고르기 다섯 판을 한 줄씩 — 그 판에서 가장 많이 고른 단어를 크게, 나머지 다섯은 고른 수 순서로 옆에 (2026.10.14 사용자). 「다음 단어」로 1번부터.
     · 6번부터는 나머지 단어(답이 모인 것)가 같은 화면으로 이어집니다 — 번호는 「N / 전체」(2026.10.13 사용자 "나머지 단어들도 똑같이").
     · 판정 없음 — 숫자도 맞음·틀림도 없습니다. 지도 밖 답은 껍질 바깥 흰 점(가장 먼 후보에선 뺌).
     ───────────────────────────────────────────────────────────────────── -->
<header><span class="ko">디알렉티카</span><span class="la">DIALECTICA</span></header>

<section id="ov" hidden></section>
<main class="rv" id="rv" hidden>
  <div class="left">
    <p id="no"></p>
    <p id="w"></p>
    <p class="k"><b id="nPick"></b><span data-t="s.review.picked_suffix"></span><br><span data-t="s.review.answers_label"></span> <b id="nAns"></b></p>
  </div>
  <div class="mid"><canvas id="cv"></canvas><div id="empty" data-t="s.review.no_answers"></div></div>
  <div class="right">
    <div class="far" id="far"></div>
    <div class="rest" id="rest"></div>
  </div>
</main>
<div id="idle" data-t="s.review.idle"></div>
<p id="gauge"></p>

<script>
const $ = s => document.querySelector(s);
SC.sizes();
SPHERE.mount($("#cv"));
let key = null;

function render(b){
  const R = b.review;
  const has = R && R.list && R.list.length;
  $("#idle").style.display = has ? "none" : "flex";
  if(!has){ $("#rv").hidden = true; $("#ov").hidden = true; SPHERE.stop(); key = null; return; }
  const i = Math.max(-1, Math.min(R.list.length - 1, R.i == null ? -1 : R.i));
  /* 첫 장 — 5개 함께 */
  if(i < 0){
    $("#rv").hidden = true; $("#ov").hidden = false; SPHERE.stop(); key = null;
    /* 판은 모두에게 같습니다(DLK.pickRounds). 고른 수는 장부의 review.list에서, 같은 수면 목록 순서(먼저 고른 쪽) */
    const at = new Map(R.list.map((r, k) => [r.w, k]));
    const nOf = w => { const r = R.list[at.get(w)]; return r ? r.n : 0; };
    $("#ov").innerHTML = `<h2>${DLK.T("s.review.top")}</h2>` + DLK.pickRounds().map((round, k) => {
      const [top, ...rest] = round.slice().sort((a, b) => nOf(b) - nOf(a) || (at.get(a) ?? 99) - (at.get(b) ?? 99));
      return `<div class="r"><span class="k">${k + 1}</span>`
        + `<span class="top"><span class="w">${DLK.esc(top)}</span><span class="n">${DLK.T("s.review.n_people", {n:`<b>${nOf(top)}</b>`})}</span></span>`
        + `<span class="rest5">${rest.map(w => `<span>${DLK.esc(w)}<b>${nOf(w)}</b></span>`).join("")}</span></div>`;
    }).join("");
    return;
  }
  $("#ov").hidden = true; $("#rv").hidden = false;
  const r = R.list[i];
  const k = i + "|" + r.w + "|" + r.ans.length;
  if(k === key) return;                              /* 같은 단어면 구를 다시 돌리지 않습니다 */
  key = k;
  $("#no").textContent = `${i + 1} / ${R.list.length}`;
  $("#w").textContent = r.w;
  $("#nPick").textContent = r.n;
  $("#nAns").textContent = r.ans.length;
  const FAR = r.far || [];
  const rest = r.ans.filter((x, j) => !FAR.includes(j));
  $("#far").innerHTML = FAR.map(j => r.ans[j]).filter(Boolean).map(x =>
    `<div class="p"><span class="nm">${DLK.esc(x.name)}</span><span class="a">${DLK.esc(x.a)}</span></div>`).join("");
  $("#rest").innerHTML = rest.map(x =>
    `<div class="p"><span class="nm">${DLK.esc(x.name)}</span><span class="a">${DLK.esc(x.a)}</span></div>`).join("");
  $("#empty").style.display = r.ans.length ? "none" : "flex";
  SPHERE.poster(r.w);
  /* 먼 둘이 같은 말이면 점이 겹칩니다 — 점 하나에 이름을 나란히(2026.10.13 사용자 "거리가 먼 두 사람이 구에 나와야 하는데 지금 안 보이는데?") */
  const byWord = {};
  FAR.forEach(j => { const x = r.ans[j]; if(!x) return; (byWord[x.a] || (byWord[x.a] = [])).push(x.name); });
  const hiMarks = Object.entries(byWord).map(([a, names]) => ({ text:a, hi:true, label:a, sub:names.join(" · ") }));
  const restMarks = r.ans.filter((x, j) => !FAR.includes(j)).map(x => ({ text:x.a }));
  SPHERE.marks([...restMarks, ...hiMarks]);
  SPHERE.start();
}
Bus.onState(render);
addEventListener("resize", () => { SC.sizes(); key = null; render(Bus.state()); });
$("#gauge").textContent = `판 ${Bus.build}`;
</script>
</body>
</html>
