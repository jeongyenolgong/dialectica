<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>기획서 그림 — 창작 두 화면</title>
<!-- 기획서용 그림. 실제 창작 화면(p6-create.html)을 두 틀에 띄웁니다: ① 쌍 고르기 ② 문장 쓰기 -->
<style>
  body{margin:0; background:#fff; font-family:-apple-system,"Apple SD Gothic Neo","Pretendard",sans-serif; color:#333}
  .row{display:flex; gap:40px; width:820px}
  .col{width:390px}
  .cap{text-align:center; font-size:15px; height:30px; line-height:30px; margin-bottom:4px}
  iframe{width:390px; height:844px; border:0; display:block}
</style>
<script>/* 장부 씨앗 — 비어 있으면 bus.js가 첫 화면으로 돌려보냅니다(혼자 모드). 이 단계의 누름 수를 먼저 심습니다 */
try{ localStorage.setItem("dlk.book", JSON.stringify({press:3, players:[]})); }catch(e){}</script>
</head>
<body>
<div class="row">
  <div class="col"><p class="cap">① 내가 모은 쌍 중 하나를 고름</p><iframe id="f1" src="../p6-create.html"></iframe></div>
  <div class="col"><p class="cap">② 두 말을 넣어 문장 하나</p><iframe id="f2" src="../p6-create.html"></iframe></div>
</div>
<script>
function drive(id, step){
  const f = document.getElementById(id);
  f.addEventListener("load", () => {
    const w = f.contentWindow;
    w.eval(`book = {press: 3, players: [{id: Bus.me(), name: "예시", start: [30,30,40],
      got: [{w:"도전", a:"안주", n:1}, {w:"기존의 틀", a:"새로운 시도", n:2}, {w:"응시", a:"곁눈질", n:3}, {w:"일상", a:"사건", n:4}]}], sentences: []};
      PH.clear(); $("#guide").textContent = GUIDE; paint();`);
    if(step === 2) w.eval(`sel = {w:"도전", a:"안주"}; paint(); $("#text").value = "도전은 안주에서 시작된다";`);
  });
}
drive("f1", 1); drive("f2", 2);
</script>
</body></html>
