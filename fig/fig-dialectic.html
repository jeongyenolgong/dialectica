<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>기획서 그림 — 정·반·합</title>
<link rel="stylesheet" href="../font.css">
<style>
  body{margin:0; background:#fff; font-family:-apple-system,"Apple SD Gothic Neo","Pretendard",sans-serif; color:#333}
  .row{display:flex; align-items:flex-start; width:1100px; padding:4px}
  .col{flex:1; text-align:center}
  .han{font-size:52px; color:#101c8c; line-height:1; margin:0 0 14px; font-family:"Apple SD Gothic Neo",serif}
  .t{font-size:15px; font-weight:700; color:#1a1a1a; margin:0 0 10px}
  .m{font-size:20px; color:#1a1a1a; margin:0 0 8px}
  .w{display:inline-block; background:#101c8c; color:#fff; font-family:"Galmuri11",sans-serif; font-size:22px; padding:2px 8px; vertical-align:middle}
  .s{font-size:14px; color:#666; margin:0}
  .arrow{width:120px; padding-top:64px; text-align:center; color:#101c8c; font-size:22px}
</style></head>
<body>
<div class="row">
  <div class="col"><p class="han">正</p><p class="t">포스터의 단어</p><p class="m"><span class="w">도전</span></p><p class="s">기아의 언어에서 뽑은 30개</p></div>
  <div class="arrow">▶</div>
  <div class="col"><p class="han">反</p><p class="t">그 단어의 Opposite, 내 답</p><p class="m">Opposite → 「안주」</p><p class="s">30개 단어 모두 같은 질문</p></div>
  <div class="arrow">▶</div>
  <div class="col"><p class="han">合</p><p class="t">두 단어를 엮은 문장</p><p class="m"><span class="w">도전</span>은 <span class="w">일상</span>에서 시작된다</p><p class="s">상반된 개념의 창의적 융합</p></div>
</div>
</body></html>
