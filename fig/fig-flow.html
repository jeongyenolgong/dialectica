<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>기획서 그림 — 진행 흐름 다섯 단계</title>
<link rel="stylesheet" href="../font.css">
<style>
  body{margin:0; background:#fff; font-family:-apple-system,"Apple SD Gothic Neo","Pretendard",sans-serif; color:#333}
  .row{display:flex; align-items:center; gap:0; width:1242px; padding:4px}
  .card{width:206px; height:198px; box-sizing:border-box; border:2px solid #101c8c; border-radius:10px; text-align:center; padding:14px 8px}
  .card h2{font-family:"Galmuri11",sans-serif; font-weight:normal; font-size:34px; color:#101c8c; margin:4px 0 10px}
  .card p{margin:0; font-size:14px; line-height:1.5; color:#333}
  .card .b{margin-top:10px; font-weight:700; color:#1a1a1a}
  .card .dim{color:#999; margin-top:10px}
  .arrow{width:34px; text-align:center; color:#101c8c; font-size:22px}
  .y{color:#e0a800}.r{color:#f0505f}.g{color:#17b36f}
</style></head>
<body>
<div class="row">
  <div class="card"><h2>입장</h2><p>초대장 QR<br>이름 입력<br>내 출발 비율 확인</p><p class="b">세 캐릭터 출발점</p></div>
  <div class="arrow">▶</div>
  <div class="card"><h2>수집</h2><p>포스터의 단어 입력<br>그 단어의 Opposite 답</p><p class="b"><span class="y">선구자</span> · <span class="r">모험가</span> · <span class="g">혁신가</span> +20</p></div>
  <div class="arrow">▶</div>
  <div class="card"><h2>창작</h2><p>모은 단어 두 개로<br>문장 하나</p><p class="b">OU +10</p></div>
  <div class="arrow">▶</div>
  <div class="card"><h2>투표</h2><p>두 문장 중<br>더 좋은 것 고르기</p><p class="dim">게이지 없음</p></div>
  <div class="arrow">▶</div>
  <div class="card"><h2>결과</h2><p>최다 득표 문장 5개<br>함께 리뷰</p><p class="b">모두 100 확인</p></div>
</div>
</body></html>
