<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>기획서 그림 — 수집 세 화면</title>
<!-- 기획서용 그림. 실제 수집 화면(p4p5-collect.html)을 세 틀에 띄우고 각 단계로 몰아 찍습니다.
     python ../server.py 를 켠 뒤 Chrome 헤드리스로 http://localhost:8000/fig/fig-collect.html 을 찍습니다(build_figs.sh). -->
<style>
  body{margin:0; background:#fff; font-family:-apple-system,"Apple SD Gothic Neo","Pretendard",sans-serif; color:#333}
  .row{display:flex; gap:40px; padding:0 0 0 0; width:1200px}
  .col{width:390px}
  .cap{text-align:center; font-size:15px; height:30px; line-height:30px; margin-bottom:4px}
  iframe{width:390px; height:844px; border:0; display:block}
</style>
<script>/* 장부 씨앗 — 비어 있으면 bus.js가 첫 화면으로 돌려보냅니다(혼자 모드). 이 단계의 누름 수를 먼저 심습니다 */
try{ localStorage.setItem("dlk.book", JSON.stringify({press:1, players:[]})); }catch(e){}</script>
</head>
<body>
<div class="row">
  <div class="col"><p class="cap">① 단어 입력</p><iframe id="f1" src="../p4p5-collect.html"></iframe></div>
  <div class="col"><p class="cap">② 질문에 답</p><iframe id="f2" src="../p4p5-collect.html"></iframe></div>
  <div class="col"><p class="cap">③ 거리 구 · 게이지 상승</p><iframe id="f3" src="../p4p5-collect.html"></iframe></div>
</div>
<script>
/* 틀마다 장부를 손으로 넣습니다 — 출발 비율만 다르고 흐름은 실제 코드 그대로입니다 */
function drive(id, start, step){
  const f = document.getElementById(id);
  f.addEventListener("load", () => {
    const w = f.contentWindow;
    w.eval(`book = {press: 2, players: [{id: Bus.me(), name: "예시", start: [${start}], got: []}]}; paint(); gs.set(PH.state(book).g, null);`);
    if(step === 2) w.eval(`cur = DLK.WORDS[1]; toCond(); PH.clear(); $("#q").textContent = DLK.COND[cur.c].q;`);
    if(step === 3) w.eval(`const x = DLK.WORDS[1], C = DLK.CHARS[x.ch]; PH.clear(); show("vS");
      SPHERE.poster(x.w); SPHERE.place("안주");
      $("#vS").style.setProperty("--gc", C.color);
      $("#sWord").innerHTML = '<span class="je">' + DLK.esc(x.w) + '</span>'; $("#sMine").textContent = "안주"; $("#sOut").textContent = "";
      $("#gainN").textContent = "+" + DLK.STEP; $("#gainC").textContent = C.ko; $("#gainNote").textContent = "";
      book.players[0].got = [{w: x.w, a: "안주", n: 1}]; gs.set(PH.state(book).g, null); SPHERE.start();`);
  });
}
drive("f1", "70,50,80", 1); drive("f2", "30,30,40", 2); drive("f3", "30,30,40", 3);
</script>
</body></html>
