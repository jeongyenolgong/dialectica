<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>기획서 그림 — 수집 조건 하나</title>
<link rel="stylesheet" href="../font.css">
<style>
  body{margin:0; background:#fff; font-family:-apple-system,"Apple SD Gothic Neo","Pretendard",sans-serif; color:#333}
  .wrap{width:1242px; padding:4px; display:flex; justify-content:center}
  .card{width:480px; box-sizing:border-box; border:2px solid #101c8c; border-radius:10px; overflow:hidden; text-align:center}
  .head{background:#101c8c; color:#fff; padding:14px 0 10px}
  .head h2{font-family:"Galmuri11",sans-serif; font-weight:normal; font-size:36px; margin:0}
  .head p{margin:4px 0 0; font-size:13px; color:#aeb8f0}
  .body{padding:18px 16px 22px}
  .w{display:inline-block; background:#101c8c; color:#fff; font-family:"Galmuri11",sans-serif; font-size:30px; padding:4px 14px}
  .q{font-size:17px; line-height:1.5; margin:14px 0 0; color:#1a1a1a}
  .ex{font-size:13px; color:#777; margin:14px 0 2px}
  .a{font-size:20px; font-weight:700; color:#1a1a1a; margin:0}
</style></head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head"><h2>Opposite</h2><p>30개 단어 모두</p></div>
    <div class="body">
      <span class="w">도전</span>
      <p class="q">이 단어의 Opposite을<br>적어 주세요.</p>
      <p class="ex">답 예시</p><p class="a">안주</p>
    </div>
  </div>
</div>
</body></html>
