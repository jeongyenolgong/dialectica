<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
<title>디알렉티카 — 대기</title>
<link rel="stylesheet" href="font.css?b=261007-1">
<link rel="stylesheet" href="phone.css?b=261012-1">
<style>
  /* 문구가 화면의 주인공 — 6.3 */
  #line{font-size:32px; letter-spacing:.04em; line-height:1.4; text-align:center;
        word-break:keep-all; white-space:pre-wrap}
  .caret{display:inline-block; width:16px; height:32px; background:var(--name); vertical-align:-4px; margin-left:2px}
  .caret.off{background:transparent}
  #dots{margin-top:60px; font-size:20px; color:var(--line); letter-spacing:.1em; min-height:1.2em}
</style>
<script src="bus.js?b=261013-3"></script>
<script src="data.js?b=261013-1"></script>
<script src="phone.js?b=261013-2"></script>
</head>
<body>
<!-- ─────────────────────────────────────────────────────────────────────
     P3 대기 — 입장 후 · 리뷰 타임 · 결과 발표 때 씁니다. 조작이 하나도 없는 화면.
     빠져나오는 길은 진행자 신호뿐입니다. 내 게이지는 헤더 아래에 그대로 보입니다.
     ───────────────────────────────────────────────────────────────────── -->
<div class="phone">
  <div class="head"><span class="ttl">디알렉티카</span></div>
  <div class="strip" id="strip"></div>
  <main>
    <section class="view on">
      <div class="mid">
        <p id="line"></p>
        <p id="dots"></p>
      </div>
    </section>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const TEXT = "잠시만 기다려 주세요";     /* 6.3 확정 */
let shown = 0, caretOn = true;
const paint = () => $("#line").innerHTML = TEXT.slice(0, shown) + `<span class="caret${caretOn ? "" : " off"}"></span>`;
for(let i = 1; i <= TEXT.length; i++) setTimeout(() => { shown = i; paint(); }, i*90);
setTimeout(() => setInterval(() => { caretOn = !caretOn; paint(); }, 500), TEXT.length*90);
let n = 0;
setInterval(() => { n = (n+1) % 4; $("#dots").textContent = "대기 중" + "·".repeat(n); }, 400);
paint();

/* 내 게이지 셋 — 창작·투표가 없어져 OU 게이지는 안 보입니다(2026.10.13) */
const gs = PH.strip($("#strip"), false);
Bus.onState(b => gs.set(PH.state(b).g, null));
</script>
</body>
</html>
