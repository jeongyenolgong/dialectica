<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
<title>디알렉티카 — 입장</title>
<link rel="stylesheet" href="font.css?b=261007-1">
<link rel="stylesheet" href="phone.css?b=261012-1">
<script src="bus.js?b=261013-3"></script>
<script src="data.js?b=261013-1"></script>
<script src="phone.js?b=261007-1"></script>
</head>
<body>
<!-- ─────────────────────────────────────────────────────────────────────
     P1 입장 — 초대장 QR로 들어오는 문 (2026.10.07)
     ① 「나를 넣어 주세요」라고 말합니다 → 진행자 화면이 개인 코드를 정합니다(출발 비율은 고른 5개에서)
     ② 이름을 넣고 「입장」 → P1b에서 30개 중 5개를 고르고(2026.10.13) → P2에서 내 상태(세 캐릭터 비율)를 봅니다
     ⭐ 초대장 QR은 모두 같습니다. 사람을 가르는 것은 이 폰입니다(새로 찍어도 같은 사람).
     ⛔ 다시 들어오는 사람(폰 기록이 날아간 사람)은 이 문이 아니라 재접속 QR로 옵니다.
     ───────────────────────────────────────────────────────────────────── -->
<div class="phone">
  <div class="head"><span class="ttl">디알렉티카</span></div>
  <main>
    <div id="flash"></div>
    <section class="view on" id="v">
      <div class="mid">
        <p class="guide" id="guide"></p>
        <label class="field" id="field">
          <input id="name" placeholder="이름" autocomplete="off" autocapitalize="off"
                 autocorrect="off" spellcheck="false" enterkeyhint="done">
        </label>
        <p class="msg" id="msg"></p>
        <button class="btn" id="enter">입장</button>
        <p class="sub" id="wait" style="margin-top:28px"></p>
      </div>
    </section>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const ME = Bus.me();
const MAXLEN = 12;                       /* 6.2 확정 — 최대 12자 */
let joined = false, sent = null, gone = false;

PH.typeOut($("#guide"), "이름을 입력하세요", 60);

/* ⭐ 이름 규칙(6.2) — 한글·영문·공백만, 12자까지.
   ⛔ 치는 동안 칸을 고쳐 쓰지 않습니다 — 천지인 조합이 끊깁니다. 「입장」을 누를 때 한 번만 봅니다 */
function check(raw){
  const s = DLK.tidy(raw);
  if(!s) return {err:"이름을 입력하세요"};
  if(/[ㄱ-ㆎ]/.test(s)) return {err:"글자를 끝까지 입력하세요"};
  if(!/^[가-힣A-Za-z ]+$/.test(s)) return {err:"한글과 영문만 쓸 수 있어요"};
  if([...s].length > MAXLEN) return {err:`${MAXLEN}자까지 쓸 수 있어요`};
  return {name:s};
}

function goNext(){
  if(gone) return; gone = true;
  Bus.go("p1b-pick.html");            /* 번쩍임 없음 (2026.10.13 사용자 "번쩍번쩍하는 효과 지워줘") */
}

$("#enter").onclick = () => PH.commit($("#name"), raw => {
  const r = check(raw);
  if(r.err){ $("#msg").textContent = r.err; PH.shake($("#field")); return; }
  $("#msg").textContent = "";
  sent = r.name;
  $("#enter").classList.add("dim");
  /* 장부에 닿기 전에는 「잠시만 기다려 주세요」 — 「연결하는 중」은 참가자에게 안 보입니다(2026.10.13 사용자) */
  if(!joined) $("#wait").textContent = "잠시만 기다려 주세요";
  /* ⛔ 장부에 이름이 닿은 것을 **보고 나서** 넘어갑니다 — 곧바로 넘어가면
        다시 말할 기회가 같이 사라져 끝까지 이름 없는 사람이 됩니다 */
  Bus.sayUntil({name:{id:ME, name:sent}}, b => (Bus.mine(b) || {}).name === sent);
});
$("#name").addEventListener("keydown", e => { if(e.key === "Enter" && !e.isComposing) $("#enter").click(); });

/* 진행자 화면에 「나를 넣어 주세요」 — 늦게 열려도 들어가게 2초마다 */
const knock = () => { if(!joined) Bus.say({join:{id:ME}}); };
knock(); setInterval(knock, 2000);

Bus.onState(b => {
  const mine = Bus.mine(b);
  if(mine){ joined = true; if(!sent) $("#wait").textContent = ""; }
  /* 이미 이름이 있는 사람(새로고침·다시 찍음)은 곧장 내 상태로 */
  if(mine && mine.name && (!sent || mine.name === sent)) goNext();
});
</script>
</body>
</html>
