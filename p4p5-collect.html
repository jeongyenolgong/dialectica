<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store">
<!-- ⛔ 확대 금지 — 두 번 두드리면 화면이 확대되어 판이 어긋났습니다 (2026.08.14) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
<title>디알렉티카 — 단어 수집</title>
<link rel="stylesheet" href="font.css?b=261007-1">
<link rel="stylesheet" href="phone.css?b=261012-1">
<style>
  #prog{font-size:18px; color:var(--line); letter-spacing:.04em; text-decoration:underline;
        text-underline-offset:5px; cursor:pointer; margin-bottom:22px}
  #word{font-size:40px; line-height:1.2; text-align:center; word-break:keep-all}
  #word .je{padding:4px 10px}
  #ckind{margin-top:14px; font-size:16px; color:var(--line); letter-spacing:.1em}
  #q{margin-top:22px}
  /* 거리 구 — 내 답이 포스터 단어에서 얼마나 떨어져 있는지. 그 아래에 얻은 캐릭터(+20)가 그때 처음 드러납니다 */
  #vS .mid{padding-top:10px}
  #sWord{font-size:26px; line-height:1.2}
  #cv{display:block; width:100%; max-width:340px; aspect-ratio:1/1; margin-top:4px}
  #sMine{font-size:22px; color:#5FE6B0; letter-spacing:.03em; word-break:keep-all; text-align:center}
  #sOut{font-size:13px; color:var(--line); margin-top:6px; letter-spacing:.04em; min-height:16px}
  #gainN{font-size:40px; line-height:1; margin-top:10px; color:var(--gc)}
  #gainC{font-size:20px; margin-top:6px; color:var(--gc)}
  #gainNote{margin-top:8px}
  #okS{margin-top:16px}
  .done-note{font-size:18px; color:var(--line); margin-top:24px; text-align:center}
</style>
<script src="bus.js?b=261013-3"></script>
<script src="data.js?b=261013-1"></script>
<script src="phone.js?b=261007-1"></script>
<script src="sphere-table.js?b=261012-7"></script>
<script src="sphere-lookup.js?b=261012-1"></script>
<script src="sphere.js?b=261013-3"></script>
</head>
<body>
<!-- ─────────────────────────────────────────────────────────────────────
     수집 (2026.10.07 초기판 복귀 · 10.12 거리 구)
       ① 포스터에서 찾은 단어를 입력 — 30개 전부와 견줍니다(관대한 대조)
       ② 그 단어의 Opposite을 씁니다 — 조건은 하나(2026.10.07 오후)
       ③ 거리 구 — 내 답이 포스터 단어에서 얼마나 떨어졌나를 보고, 그 아래 캐릭터 게이지 +20 (이때 어느 캐릭터인지 처음 보입니다).
          확인을 누르면 ①로 (2026.10.12 사용자 "구에서 두 단어간의 거리를 확인하고 확인 버튼을 누른 다음 새로운 단어를 입력")
     ⛔ 포스터 코드 · 힌트 · 팀은 없습니다(2026.10.07 사용자).
     ⛔ 답은 판정하지 않습니다 — 빈칸이거나 포스터 단어를 그대로 쓴 것만 돌려보냅니다.
     ───────────────────────────────────────────────────────────────────── -->
<div class="phone">
  <div class="head">
    <span class="ttl" id="htitle">디알렉티카</span>
    <span class="side"><button class="hbtn" id="drawerBtn">서랍</button></span>
  </div>
  <div class="strip" id="strip"></div>
  <main>
    <div id="flash"></div>
    <div id="toast"></div>

    <!-- ① 단어 입력 -->
    <section class="view on" id="vW">
      <div class="mid">
        <p id="prog"></p>
        <p class="guide" id="gW"></p>
        <label class="field" id="fW">
          <input id="inW" autocomplete="off" autocapitalize="off" autocorrect="off"
                 spellcheck="false" enterkeyhint="done">
        </label>
        <p class="msg" id="mW"></p>
        <button class="btn" id="okW">확인</button>
        <p class="done-note" id="allDone" hidden>30개를 모두 모았습니다</p>
      </div>
    </section>

    <!-- ② 조건 답 -->
    <section class="view" id="vC">
      <div class="mid">
        <div id="word"></div>
        <p id="ckind"></p>
        <p class="guide" id="q"></p>
        <label class="field" id="fC">
          <input id="inC" autocomplete="off" autocapitalize="off" autocorrect="off"
                 spellcheck="false" enterkeyhint="done">
        </label>
        <p class="msg" id="mC"></p>
        <div class="row2">
          <button class="btn dim" id="backC">뒤로</button>
          <button class="btn" id="okC">수집</button>
        </div>
      </div>
    </section>

    <!-- ③ 거리 구 + 얻은 캐릭터 -->
    <section class="view" id="vS">
      <div class="mid">
        <div id="sWord"></div>
        <canvas id="cv"></canvas>
        <p id="sMine"></p>
        <p id="sOut"></p>
        <p id="gainN"></p>
        <p id="gainC"></p>
        <p class="sub" id="gainNote"></p>
        <button class="btn" id="okS">확인</button>
      </div>
    </section>

    <!-- 서랍 — 보기 전용 -->
    <section class="view" id="vD"><div class="list" id="list"></div></section>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const ME = Bus.me();
let book = Bus.state(), cur = null, back = "vW", allDone = false;
let gs = PH.strip($("#strip"), false);

/* 폰 쪽지 — 내가 모은 단어 {w, a, n}. 장부(진행자 화면)에도 똑같이 적힙니다 */
const st = () => PH.state(book);

function show(id){
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === id));
  const inDrawer = id === "vD";
  $("#htitle").textContent = inDrawer ? "서랍" : "디알렉티카";
  $("#drawerBtn").textContent = inDrawer ? "닫기" : "서랍";
}
function paint(){
  const s = st();
  gs.set(s.g, null);
  $("#prog").textContent = `모은 단어 ${s.words.length} / ${DLK.WORDS.length}`;
  allDone = s.words.length >= DLK.WORDS.length;
  $("#allDone").hidden = !allDone;
  $("#fW").hidden = allDone; $("#okW").hidden = allDone; $("#gW").hidden = allDone;
}

/* ── ① 단어 입력 ── */
function toWord(quick){
  PH.clear();
  show("vW"); back = "vW";
  $("#inW").value = ""; $("#mW").textContent = "";
  paint();
  const t = "포스터에서 찾은 단어를 입력하세요";
  if(quick) $("#gW").textContent = t; else PH.typeOut($("#gW"), t, 50);
}
function sayW(t){ $("#mW").textContent = t; PH.later(1800, () => { if($("#mW").textContent === t) $("#mW").textContent = ""; }); }

$("#okW").onclick = () => PH.commit($("#inW"), raw => {
  if(!DLK.tidy(raw)) return;
  const hit = DLK.findWord(raw);
  /* ⭐ 틀려도 잃는 것이 없습니다 — 오답과 오타를 가르지 않고, 횟수 제한도 없습니다 */
  if(!hit){ sayW("다시 보세요"); PH.shake($("#fW")); return; }
  if(st().words.some(p => p.w === hit.w)){ sayW("이미 모은 단어예요"); PH.blink($("#drawerBtn")); return; }
  cur = hit;
  $("#fW").style.background = "var(--name)";          /* 맞음 — 칸이 흰색으로 물듭니다 */
  setTimeout(() => { $("#fW").style.background = ""; toCond(); }, 180);
});

/* ── ② 조건 답 ── */
function toCond(){
  PH.clear();
  show("vC"); back = "vC";
  const c = DLK.COND[cur.c];
  $("#word").innerHTML = `<span class="je">${DLK.esc(cur.w)}</span>`;
  $("#ckind").textContent = cur.c;
  $("#inC").value = ""; $("#inC").placeholder = c.hint; $("#mC").textContent = "";
  PH.typeOut($("#q"), c.q, 45, () => $("#inC").focus());
}
function sayC(t){ $("#mC").textContent = t; PH.later(1800, () => { if($("#mC").textContent === t) $("#mC").textContent = ""; }); }
$("#backC").onclick = () => { $("#inC").blur(); toWord(true); };

$("#okC").onclick = () => PH.commit($("#inC"), raw => {
  const a = DLK.tidy(raw);
  if(!a){ sayC("답을 입력하세요"); PH.shake($("#fC")); return; }
  if(DLK.sameAsWord(a, cur.w)){ sayC("다시 써 보세요"); PH.shake($("#fC")); return; }
  collect(cur, a);
});

/* ── ③ 수집 ── */
function collect(x, a){
  const s0 = st();
  if(s0.words.some(p => p.w === x.w)) return toWord(true);   /* 두 번 누름 */
  const before = s0.g ? s0.g[x.ch] : null;
  const nth = s0.words.length + 1;
  const mine = PH.load("dlk.pairs." + ME, []);
  mine.push({w:x.w, a, n:nth});
  PH.save("dlk.pairs." + ME, mine);
  /* 진행자 화면이 받아 적습니다 — 닿았다는 표시(ack)가 보일 때까지 다시 말합니다 */
  Bus.sayUntil({collect:{id:ME, nth, w:x.w, a}},
               b => ((((b.ack||{})[ME]||{}).p)||[]).includes(nth));

  const s1 = st();
  const after = s1.g ? s1.g[x.ch] : null;
  const C = DLK.CHARS[x.ch];
  /* 거리 구 — 내 답의 자리. 판정은 없고, 지도 밖(어휘에 없는 말)이면 껍질 바깥에 놓입니다 */
  SPHERE.poster(x.w);
  const r = SPHERE.place(a);
  PH.clear(); show("vS");
  $("#vS").style.setProperty("--gc", C.color);
  $("#sWord").innerHTML = `<span class="je">${DLK.esc(x.w)}</span>`;
  $("#sMine").textContent = a;
  $("#sOut").textContent = r.outside ? "아직 지도에 없는 말" : "";
  const full = before != null && before >= DLK.FULL;
  $("#gainN").textContent = full ? "FULL" : `+${DLK.STEP}`;
  $("#gainC").textContent = C.ko;
  $("#gainNote").textContent = full ? "이 게이지는 이미 가득 찼어요" : (after >= DLK.FULL ? "가득 찼습니다!" : "");
  PH.flash();
  gs.set(s1.g, null); gs.pulse(x.ch);
  PH.blink($("#drawerBtn"));
  SPHERE.start();
}
$("#okS").onclick = () => { SPHERE.stop(); toWord(true); };

/* ── 서랍 — 내가 모은 단어와 내 답 ── */
function openDrawer(){
  $("#inW").blur(); $("#inC").blur(); SPHERE.stop();
  const list = $("#list");
  const ws = st().words;
  list.innerHTML = ws.length ? "" : `<p class="empty">아직 모은 단어가 없습니다</p>`;
  ws.slice().reverse().forEach((p, k) => {
    const x = DLK.WORDS.find(o => o.w === p.w) || {c:"", ch:0};
    const r = document.createElement("div");
    r.className = "drow";
    r.innerHTML = `<span class="no">${String(ws.length - k).padStart(2,"0")}</span>`
      + `<span class="txt"><span class="je">${DLK.esc(p.w)}</span><span>:</span>`
      + `<span>${DLK.esc(p.a)}</span><span class="k">${x.c} · ${DLK.CHARS[x.ch].short}</span></span>`;
    list.appendChild(r);
  });
  show("vD");
}
$("#drawerBtn").onclick = () => {
  if($("#vD").classList.contains("on")) show(back);
  else openDrawer();
};
$("#prog").onclick = openDrawer;

/* 엔터로도 됩니다 — 조합 중인 엔터는 무시합니다 */
$("#inW").addEventListener("keydown", e => { if(e.key === "Enter" && !e.isComposing) $("#okW").click(); });
$("#inC").addEventListener("keydown", e => { if(e.key === "Enter" && !e.isComposing) $("#okC").click(); });

/* ── 순위 알림 (6.12) — 1분마다 1·2·3위에게 「현재 N위」 ── */
Bus.watchRank("cnt", a => PH.toast(`현재 ${a.no}위`));

Bus.onState(b => {
  book = b;
  /* 장부에만 있고 폰에 없는 단어(다른 폰에서 모은 것 · 재접속)를 폰 쪽지에도 옮겨 둡니다 */
  const me = Bus.mine(b);
  if(me && me.got && me.got.length){
    const mine = PH.load("dlk.pairs." + ME, []);
    const have = new Set(mine.map(p => p.w));
    const add = me.got.filter(p => !have.has(p.w));
    if(add.length) PH.save("dlk.pairs." + ME, mine.concat(add));
  }
  if(!$("#vS").classList.contains("on")) paint();
});

SPHERE.mount($("#cv"));
toWord();
</script>
</body>
</html>
