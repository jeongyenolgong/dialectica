<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store">
<title>디알렉티카 — 스크린 · 입장</title>
<link rel="stylesheet" href="font.css?b=261007-1">
<link rel="stylesheet" href="screen.css?b=261007-1">
<style>
  .count{flex:0 0 auto; text-align:center; padding-top:3vh; font-size:var(--rank); color:var(--line);
         letter-spacing:.1em}
  .count b{color:var(--name); font-weight:400; font-size:var(--stage); margin:0 .3em}
  /* 이름이 들어온 순서대로 — 칸 수는 인원에 맞춰 늘립니다 */
  #names{flex:1 1 auto; min-height:0; list-style:none; padding:4vh 0 2vh;
         display:grid; grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));
         align-content:start; gap:1.6vh 1vw; text-align:center; overflow:hidden}
  #names li{font-size:var(--nm,32px); line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:clip}
  @keyframes flash{0%{opacity:0} 50%{opacity:1; filter:brightness(2.2)} 100%{opacity:1; filter:brightness(1)}}
  #names li.new{animation:flash .3s steps(3,end) 1}
</style>
<script src="bus.js?b=261007-1"></script>
<script src="data.js?b=261012-1"></script>
<script src="screen.js?b=261007-1"></script>
</head>
<body>
<!-- ─────────────────────────────────────────────────────────────────────
     스크린 9.1 입장 (2026.10.07) — 이름을 낸 사람이 들어온 순서대로 뜹니다.
     ⛔ 팀 열은 없앴습니다(2026.10.07 팀전 폐지). 새로 들어온 이름만 한 번 번쩍입니다.
     ───────────────────────────────────────────────────────────────────── -->
<header><span class="ko">디알렉티카</span><span class="la">DIALECTICA</span></header>
<p class="count">입장<b id="n">0</b>명</p>
<ul id="names"></ul>

<script>
SC.sizes();
let shown = [];
function draw(list, fresh){
  const n = list.length;
  const cols = n <= 15 ? 5 : n <= 30 ? 6 : 8;
  document.documentElement.style.setProperty("--cols", cols);
  document.documentElement.style.setProperty("--nm", (n <= 30 ? Math.round(innerWidth*0.02/12)*12 : 24) + "px");
  document.getElementById("names").innerHTML =
    list.map(nm => `<li${fresh.includes(nm) ? ' class="new"' : ""}>${DLK.esc(nm)}</li>`).join("");
  document.getElementById("n").textContent = n;
}
Bus.onState(b => {
  const names = (b.players || []).filter(p => p.name).map(p => p.name);
  const fresh = names.filter(x => !shown.includes(x));
  shown = names;
  draw(names, fresh.length <= 2 ? fresh : []);
});
addEventListener("resize", () => { SC.sizes(); draw(shown, []); });
draw([], []);
</script>
</body>
</html>
