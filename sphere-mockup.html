<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
<title>디알렉티카 — 거리 구 · 합 목업</title>
<link rel="stylesheet" href="font.css?b=261007-1">
<link rel="stylesheet" href="phone.css?b=261012-1">
<style>
  #word{font-size:40px; line-height:1.2; text-align:center; word-break:keep-all}
  #word .je{padding:4px 10px}
  #q{margin-top:22px}
  /* 구 화면 */
  #vS .mid{padding-top:12px}
  #sWord{font-size:28px; line-height:1.2}
  #cv{display:block; width:100%; max-width:358px; aspect-ratio:1/1; margin-top:8px}
  #sMine{font-size:22px; color:var(--mine); letter-spacing:.03em; word-break:keep-all; text-align:center}
  #tmp{font-size:13px; color:var(--line); margin-top:10px; letter-spacing:.04em}
  /* 사이에 있는 말 — 후보 셋 + 직접 쓰기 (3번 목업, 2026.10.12) */
  #midCap{font-size:14px; color:var(--line); margin-top:18px; letter-spacing:.06em}
  .chips{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:10px; max-width:350px}
  .chip{font-size:18px; padding:6px 10px; background:transparent; color:var(--name); border:2px solid var(--line); line-height:1.1}
  .chip.on{background:var(--name); color:var(--bg); border-color:var(--name)}
  #fM{margin-top:10px; max-width:260px}
  #fM input{font-size:18px; text-align:center}
  #okS, #okH{margin-top:16px}
  /* 합 단계 — 모은 쌍 목록 */
  #lGuide{margin-bottom:6px}
  .pairs{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:14px; max-width:350px}
  .pair{font-size:18px; padding:6px 10px; background:transparent; color:var(--name); border:2px solid var(--line); line-height:1.1}
  .pair .je{padding:1px 5px; margin-right:6px}
  .pair.done{color:var(--line); border-color:var(--dim)}
  .pair.done .je{opacity:.5}
  .pair .mid{color:var(--mine); margin-left:6px}
  #hPair{font-size:22px; line-height:1.3; text-align:center}
  #hPair .mine{color:var(--mine)}
  .mock{font-size:13px; color:var(--line); margin-top:26px; letter-spacing:.04em; background:none; border:0; text-decoration:underline; text-underline-offset:4px}
  :root{--core:#FFC83D; --mine:#5FE6B0}
</style>
<script src="data.js?b=261012-1"></script>
<script src="phone.js?b=261007-1"></script>
<script src="sphere-table.js?b=261012-4"></script>
<script src="sphere-lookup.js?b=261012-1"></script>
<script src="sphere.js?b=261012-7"></script>
</head>
<body>
<!-- ─────────────────────────────────────────────────────────────────────
     거리 구 · 합 목업 (2026.10.07 · 10.12) — 그리기는 sphere.js, 실제 수집 화면(p4p5-collect.html)도 같은 것을 씁니다.
     두 단계가 분리되어 있습니다(2026.10.12 사용자 "창작 단계를 대체하는 활동이라 분리되어야 해").
       ① 수집: Opposite 입력 → 구(내 답의 자리) → 확인 → 다음 포스터 단어. 쌍이 쌓입니다.
       ② 합:   모은 쌍 하나를 고름 → 구(정·반 두 점) + 「사이에 있는 말」 후보 셋 + 직접 쓰기 → 확인.
                후보 = 정·반 벡터의 가운데에 가까운 흔한 말(sphere-vec.bin, 128차원). 지도 밖인 답이면 후보 없음.
                ⛔ 이 단계가 창작(p6)을 대체하는 안인지는 사용자 판단 대기.
       중심 = 포스터 단어(앰버) · 흰 점 = 거리표의 단어 · 민트 점 = 내 답 · 테두리 흰 네모 = 사이의 말 후보
     검증용: 주소에 ?p=포스터단어 로 포스터를 고정, #내답 으로 바로 입력, ?demo=1 로 쌍 셋을 미리 채워 합 단계에서 시작.
     ───────────────────────────────────────────────────────────────────── -->
<div class="phone">
  <div class="head"><span class="ttl" id="htitle">디알렉티카</span></div>
  <main>
    <!-- ① 수집 — Opposite 입력 -->
    <section class="view on" id="vC">
      <div class="mid">
        <div id="word"></div>
        <p class="guide" id="q">이 단어의 Opposite을 적어 주세요.</p>
        <label class="field" id="fC">
          <input id="inC" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
        </label>
        <p class="msg" id="mC"></p>
        <button class="btn" id="okC">확인</button>
        <button class="mock" id="toH">모은 쌍 0 · 합으로 (목업: 진행자 역할)</button>
      </div>
    </section>

    <!-- ① 수집 — 거리 구 -->
    <section class="view" id="vS">
      <div class="mid">
        <div id="sWord"></div>
        <canvas id="cv"></canvas>
        <p id="sMine"></p>
        <p id="tmp"></p>
        <button class="btn" id="okS">확인</button>
      </div>
    </section>

    <!-- ② 합 — 모은 쌍 목록 -->
    <section class="view" id="vL">
      <div class="mid">
        <p class="guide" id="lGuide">쌍 하나를 골라<br>그 사이에 있는 말을 찾으세요</p>
        <div class="pairs" id="pairs"></div>
        <p class="sub" id="lNote"></p>
      </div>
    </section>

    <!-- ② 합 — 구 + 사이에 있는 말 -->
    <section class="view" id="vH">
      <div class="mid">
        <p id="hPair"></p>
        <canvas id="cvH"></canvas>
        <p id="midCap">사이에 있는 말</p>
        <div class="chips" id="chips"></div>
        <label class="field" id="fM">
          <input id="inM" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="직접 쓰기">
        </label>
        <p class="msg" id="mH"></p>
        <div class="row2">
          <button class="btn dim" id="backH">뒤로</button>
          <button class="btn" id="okH">확인</button>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const Q = new URLSearchParams(location.search);
/* 목업 상태 — 모은 쌍 {w, a, mid}. 실제 화면에서는 장부(서랍)에 있는 것 */
let pairs = Q.get("demo") ? [{w:"경계", a:"연결"}, {w:"관점", a:"안주"}, {w:"일상", a:"사건"}] : [];
let POSTER = null, sel = null;
function show(id){ document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === id)); $("#htitle").textContent = (id === "vL" || id === "vH") ? "디알렉티카 — 합" : "디알렉티카"; }

/* ── ① 수집 ── */
function nextPoster(){
  /* ?p= 로 고정, 아니면 아직 안 모은 단어 중 아무거나 */
  const left = DLK.WORDS.filter(x => !pairs.some(p => p.w === x.w)).map(x => x.w);
  const qp = Q.get("p");
  POSTER = (DLK.WORDS.some(x => x.w === qp) && !pairs.some(p => p.w === qp)) ? qp : left[Math.floor(Math.random() * left.length)];
  $("#word").innerHTML = `<span class="je">${DLK.esc(POSTER)}</span>`;
  $("#inC").value = ""; $("#mC").textContent = "";
  $("#toH").textContent = `모은 쌍 ${pairs.length} · 합으로 (목업: 진행자 역할)`;
  show("vC");
}
function sayC(t){ $("#mC").textContent = t; PH.later(1800, () => { if($("#mC").textContent === t) $("#mC").textContent = ""; }); }
$("#okC").onclick = () => PH.commit($("#inC"), raw => {
  const a = DLK.tidy(raw);
  if(!a){ sayC("답을 입력하세요"); PH.shake($("#fC")); return; }
  if(DLK.sameAsWord(a, POSTER)){ sayC("다시 써 보세요"); PH.shake($("#fC")); return; }
  SPHERE.mount($("#cv")); SPHERE.poster(POSTER);
  const r = SPHERE.place(a);
  sel = {w: POSTER, a};
  $("#sWord").innerHTML = `<span class="je">${DLK.esc(POSTER)}</span>`;
  $("#sMine").textContent = a;
  /* 목업에서만 — 어떻게 읽었는지. 실제 수집 화면에는 없습니다 */
  $("#tmp").textContent = r.outside ? "아직 지도에 없는 말" : (r.readAs !== a.replace(/\s+/g, " ") ? "「" + r.readAs + "」로 읽었습니다" : "");
  show("vS"); SPHERE.start();
});
$("#inC").addEventListener("keydown", e => { if(e.key === "Enter" && !e.isComposing) $("#okC").click(); });
$("#okS").onclick = () => { SPHERE.stop(); pairs.push(sel); sel = null; nextPoster(); };
$("#toH").onclick = () => { if(!pairs.length){ sayC("쌍을 하나는 모아야 합니다"); return; } paintL(); show("vL"); };

/* ── ② 합 ── */
function paintL(){
  const box = $("#pairs"); box.innerHTML = "";
  pairs.forEach(p => {
    const b = document.createElement("button"); b.className = "pair" + (p.mid ? " done" : "");
    b.innerHTML = `<span class="je">${DLK.esc(p.w)}</span>${DLK.esc(p.a)}` + (p.mid ? `<span class="mid">→ ${DLK.esc(p.mid)}</span>` : "");
    b.onclick = () => openH(p);
    box.appendChild(b);
  });
  const n = pairs.filter(p => p.mid).length;
  $("#lNote").textContent = n === pairs.length ? "모든 쌍의 사이를 찾았습니다" : `찾은 사이 ${n} / ${pairs.length}`;
}
function openH(p){
  sel = p;
  $("#hPair").innerHTML = `<span class="je">${DLK.esc(p.w)}</span><span class="co" style="margin:0 8px;color:var(--line)">:</span><span class="mine">${DLK.esc(p.a)}</span>`;
  SPHERE.mount($("#cvH")); SPHERE.poster(p.w); SPHERE.place(p.a);
  $("#chips").innerHTML = ""; $("#inM").value = p.mid || ""; $("#mH").textContent = "";
  SPHERE.ready().then(() => {
    const c = SPHERE.between(3, p.w);
    $("#midCap").textContent = c.length ? "사이에 있는 말" : "사이에 있는 말 — 이 답은 지도 밖이라 후보가 없습니다";
    c.forEach(w => { const b = document.createElement("button"); b.className = "chip" + (p.mid === w ? " on" : ""); b.textContent = w;
      b.onclick = () => { const on = b.classList.contains("on"); document.querySelectorAll(".chip").forEach(x => x.classList.remove("on")); if(!on) b.classList.add("on"); $("#inM").value = ""; };
      $("#chips").appendChild(b); });
  });
  show("vH"); SPHERE.start();
}
$("#inM").addEventListener("input", () => document.querySelectorAll(".chip").forEach(c => c.classList.remove("on")));
function sayH(t){ $("#mH").textContent = t; PH.later(1800, () => { if($("#mH").textContent === t) $("#mH").textContent = ""; }); }
$("#okH").onclick = () => PH.commit($("#inM"), raw => {
  const on = document.querySelector(".chip.on");
  const mid = on ? on.textContent : DLK.tidy(raw);
  if(!mid){ sayH("후보를 고르거나 직접 쓰세요"); PH.shake($("#fM")); return; }
  sel.mid = mid; SPHERE.stop(); paintL(); show("vL");
});
$("#backH").onclick = () => { SPHERE.stop(); paintL(); show("vL"); };

/* ── 시작 ── */
if(Q.get("demo")){ paintL(); show("vL"); if(Q.get("h") != null) openH(pairs[+Q.get("h")] || pairs[0]); }   /* &h=번호 로 그 쌍의 합 화면까지(검증용) */
else {
  nextPoster();
  /* 검증용 — #단어 를 붙이면 그 말을 친 것으로 바로 띄웁니다(헤드리스 촬영) */
  if(location.hash.length > 1){ $("#inC").value = decodeURIComponent(location.hash.slice(1)); $("#okC").click(); }
}
</script>
</body>
</html>
