<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
<title>디알렉티카 — 거리 구 목업</title>
<link rel="stylesheet" href="font.css?b=261007-1">
<link rel="stylesheet" href="phone.css?b=261012-1">
<style>
  #word{font-size:40px; line-height:1.2; text-align:center; word-break:keep-all}
  #word .je{padding:4px 10px}
  #q{margin-top:22px}
  /* 구 화면 */
  #vS .mid{padding-top:12px}
  #sWord{font-size:28px; line-height:1.2}
  #cv{display:block; width:100%; max-width:358px; aspect-ratio:1/1; margin-top:8px}
  #sMine{font-size:22px; color:var(--mine); letter-spacing:.03em; word-break:keep-all; text-align:center}
  #tmp{font-size:13px; color:var(--line); margin-top:10px; letter-spacing:.04em}
  :root{--core:#FFC83D; --mine:#5FE6B0}
</style>
<script src="settings.js?b=261014-4"></script>
<script src="data.js?b=261014-4"></script>
<script src="phone.js?b=261007-1"></script>
<script src="sphere-table.js?b=261012-7"></script>
<script src="sphere-lookup.js?b=261012-1"></script>
<script src="sphere.js?b=261013-3"></script>
</head>
<body>
<!-- ─────────────────────────────────────────────────────────────────────
     거리 구 목업 (2026.10.07 · 10.12) — 그리기는 sphere.js, 실제 수집 화면(p4p5-collect.html)도 같은 것을 씁니다.
     ⛔ 폐기(2026.10.12 사용자 "후보 수준이 너무 변수가 많아서 폐기할래 이어주는 단어 찾기는"):
        정·반 사이에 있는 말을 후보 셋으로 제시하는 합(合) 안. 128차원 좌표(sphere-vec.bin)까지 만들어 돌려 봤으나
        뜻이 또렷한 쌍(경계↔연결→접속·교류)만 쓸 만하고 뜻이 갈리는 말·추상 구절은 엉망이었다. 되살리지 말 것.
       Opposite 입력 → 확인 → 구가 뜹니다 → 닫기로 돌아갑니다.
       중심 = 포스터 단어(앰버로 빛남) · 흰 점 = 거리표의 단어 · 민트 점 = 내 답
     거리표 sphere-table.js (make_sphere_table.py · 공개 자료만)
       깊이 = 그 포스터 단어와 얼마나 관련 있나(어휘 49,835개 중 몇 번째로 가까운가)
       방향 = 어휘 전체를 3차원으로 접은 뜻의 지도 — 뜻이 비슷한 말끼리 같은 쪽에 모입니다
       표에 없는 답은 껍질 바깥(지도 밖)에 놓입니다
     ───────────────────────────────────────────────────────────────────── -->
<div class="phone">
  <div class="head"><span class="ttl">디알렉티카</span></div>
  <main>
    <!-- Opposite 입력 -->
    <section class="view on" id="vC">
      <div class="mid">
        <div id="word"></div>
        <p class="guide" id="q">이 단어의 Opposite을 적어 주세요.</p>
        <label class="field" id="fC">
          <input id="inC" autocomplete="off" autocapitalize="off" autocorrect="off"
                 spellcheck="false" enterkeyhint="done">
        </label>
        <p class="msg" id="mC"></p>
        <button class="btn" id="okC">확인</button>
      </div>
    </section>

    <!-- 거리 구 -->
    <section class="view" id="vS">
      <div class="mid">
        <div id="sWord"></div>
        <canvas id="cv"></canvas>
        <p id="sMine"></p>
        <p id="tmp"></p>
        <button class="btn" id="close">닫기</button>
      </div>
    </section>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const POSTER = DLK.WORDS[Math.floor(Math.random() * DLK.WORDS.length)].w;   /* 목업 — 포스터 단어 하나를 아무거나 */
$("#word").innerHTML = `<span class="je">${DLK.esc(POSTER)}</span>`;
$("#sWord").innerHTML = `<span class="je">${DLK.esc(POSTER)}</span>`;
function show(id){ document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === id)); }
SPHERE.mount($("#cv")); SPHERE.poster(POSTER);

function sayC(t){ $("#mC").textContent = t; PH.later(1800, () => { if($("#mC").textContent === t) $("#mC").textContent = ""; }); }
$("#okC").onclick = () => PH.commit($("#inC"), raw => {
  const a = DLK.tidy(raw);
  if(!a){ sayC("답을 입력하세요"); PH.shake($("#fC")); return; }
  if(DLK.sameAsWord(a, POSTER)){ sayC("다시 써 보세요"); PH.shake($("#fC")); return; }
  const r = SPHERE.place(a);
  $("#sMine").textContent = a;
  /* 목업에서만 — 어떻게 읽었는지 보여 줍니다. 실제 수집 화면에는 없습니다 */
  $("#tmp").textContent = r.outside ? "아직 지도에 없는 말" : (r.readAs !== a.replace(/\s+/g, " ") ? "「" + r.readAs + "」로 읽었습니다" : "");
  show("vS"); SPHERE.start();
});
$("#inC").addEventListener("keydown", e => { if(e.key === "Enter" && !e.isComposing) $("#okC").click(); });
$("#close").onclick = () => { SPHERE.stop(); $("#inC").value = ""; show("vC"); };
/* 검증용 — 주소 뒤에 #단어 를 붙이면 그 말을 친 것으로 바로 띄웁니다(헤드리스 촬영에 씁니다) */
if(location.hash.length > 1){ $("#inC").value = decodeURIComponent(location.hash.slice(1)); $("#okC").click(); }
</script>
</body>
</html>
